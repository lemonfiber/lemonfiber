# How long a test may run before it is reported as hung.
#
# Per test, not per run: the bound is on the one test that hangs rather than on the
# suite around it, so every other test still reports. A test that waits out a
# budget does it on a paused runtime, so nothing here waits on the wall clock for
# long; five minutes is clear of the slowest test under coverage instrumentation
# and far short of the forge's own job limit.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# The profile the coverage job runs, with the same bound as a local run: a test
# abandoned in one place and waited for in the other would be two answers to
# whether the suite finishes.
[profile.ci]
slow-timeout = { period = "60s", terminate-after = 5 }
