[default]
# Ignore hotkey mockup notation like [e]rror, [s]ervice in TUI examples.
extend-ignore-re = ["\\[[a-z]\\][a-zA-Z]+"]

[default.extend-words]
ratatui = "ratatui"
Ratatui = "Ratatui"
lemonfiber = "lemonfiber"
Servarr = "Servarr"

[files]
# The embedded app is lemonfiber-web's built output: minified JavaScript whose
# identifiers are generated, not written. Its prose is spell-checked in the repo
# that authors it, before it is built.
extend-exclude = ["assets/web"]
