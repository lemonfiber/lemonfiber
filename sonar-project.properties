sonar.projectKey=lemonfiber_lemonfiber
sonar.organization=lemonfiber
# `.github` as well as `crates`. It was `crates` alone, so nineteen hand-written
# workflows — every gate this repository runs — were read by nothing here. What
# found the one real problem in them was another repository vendoring this source
# by accident and scanning the copy.
sonar.sources=crates,.github

# `release.yml` is generated by cargo-dist and regenerated whole by
# `just release-workflow`, so a finding in it cannot be fixed where it is
# reported. What has been fixed there is fixed by a patch the recipe applies,
# each guarded by a grep that fails the recipe if it stops matching.
sonar.exclusions=.github/workflows/release.yml
# The capability vocabulary is excluded from copy-paste detection, and only from
# that. `carried.rs` is a table of ten capability contracts — no `fn`, no branch,
# every field a literal — and the `Capability` type obliges all ten to the same
# field order. The detector works on token shape, so ten records the type made
# identically shaped are ten copies of each other whatever their prose says: it
# matched `indexer.search` against `download.usenet`, whose ten strings share no
# sentence, and matched across record boundaries as well, pairing
# `indexer.proxy`+`download.usenet` against `network.egress-guard`+`library.curate`.
# The duplication is the type's requirement here, which is the one case where the
# measurement is wrong rather than the code.
#
# The run that prompted this measured the file at 77.4% — 315 of its 407 lines, in
# ten blocks, every one of them inside the file — which was 7.1% of the 4,457 lines
# the pull request publishing it changed, and the new-code condition is 3%. So the
# gate failed on a file where no repetition can be removed. Extracting the three
# `Requirement` tails that genuinely recur takes about forty of those lines and
# leaves the ten blocks standing, which is work spent on a gate that stays red and
# trips again on the eleventh capability.
#
# Main reads green on the same file only because its new-code window is the whole
# release: the lines are diluted, not gone. That is why this is a declared cap and
# not something to wait out.
#
# Narrow on purpose: everything else about the file is still analysed, and every
# other path in the repository is still checked for duplication. **Lifts when** the
# vocabulary stops being authored as Rust records — a committed data file the crate
# reads, rather than a table it compiles — at which point there is no repeated Rust
# left to detect and this line is deleted rather than widened.
sonar.cpd.exclusions=crates/lemonfiber-plugin/src/vocabulary/carried.rs
sonar.tests=crates
# `**/tests.rs` catches a test module a file keeps beside itself rather than inside
# itself. Rust declares tests in the middle of a source file, and nothing here can see
# where a file stops shipping — so five permission calls made *by* `archive.rs`'s tests,
# building a fixture and putting a scratch directory back so it could be deleted, were
# reported as unsafe permissions in production code. A file that grows findings like
# that moves its tests into `<name>/tests.rs`, which is production to nobody.
sonar.test.inclusions=**/tests/**,**/*_test.rs,**/tests.rs
# Coverage ingested from cargo-llvm-cov; the 100%-on-applicable-code gate is
# enforced in CI by `cargo llvm-cov --fail-under-lines 100` (Q-R61/Q-R62).
sonar.rust.lcov.reportPaths=lcov.info

# S2612 asks whether a file permission is safe. Four of the five it raised here were
# incidental and are now owner-only, so they are not raised at all — the finding is gone
# rather than hidden.
#
# The fifth cannot be. `archive/tests.rs` deliberately makes a file group- and
# other-readable in order to prove the restore strips those bits; a tight umask would
# otherwise leave the source at 0600 and the assertion would pass having tested nothing.
# The fixture's whole job is to be unsafe, so the question the rule asks has no answer
# there.
#
# Declaring a file as test code is not enough on its own — the rules still run over it —
# so the rule is turned off, and only where the file is test code end to end. Both
# patterns are locations this repository already treats as nothing but tests: its own
# architecture guards skip them by the same shapes, so production code cannot reach one.
# A permission set by code that ships is still reported wherever it is, including in the
# half of `archive.rs` that does.
sonar.issue.ignore.multicriteria=testperms,testdirperms
sonar.issue.ignore.multicriteria.testperms.ruleKey=rust:S2612
sonar.issue.ignore.multicriteria.testperms.resourceKey=**/tests.rs
sonar.issue.ignore.multicriteria.testdirperms.ruleKey=rust:S2612
sonar.issue.ignore.multicriteria.testdirperms.resourceKey=**/tests/**
