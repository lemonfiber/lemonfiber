[package]
name = "lemonfiber-bundled"
description = "The stack and the default bundle this build embeds, read when it is built."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license-file = "../../LICENSE"
# Not published, as `lemonfiber-manifest` is not: the release ships one binary.
publish = false
build = "build.rs"

[dependencies]
# What runs of the stack, embedded whole as the build wrote it.
include_dir = { workspace = true }

[build-dependencies]
# The same assembly every other reader uses, so the text compiled in here is the
# manifest lemonfiber reads at run time and not a second idea of it.
lemonfiber-manifest = { workspace = true }
# The default bundle's reader, which holds every copy to its pin before the pins are
# compiled in.
lemonfiber-bundle = { workspace = true }
# Reading which recordings the stack's claims name, to carry what runs and nothing else.
toml = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
lemonfiber-manifest = { workspace = true }
lemonfiber-bundle = { workspace = true }
toml = { workspace = true }
