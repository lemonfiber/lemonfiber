[package]
name = "lemonfiber-plugin"
version.workspace = true
license-file = "../../LICENSE"
publish = false
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# The stack description, for the one thing the vocabulary cannot state about itself:
# which bundled services declare each capability. The direction is one-way — nothing
# in `lemonfiber-manifest` may reach back here, or the two would be a cycle.
lemonfiber-manifest = { path = "../lemonfiber-manifest" }
schemars = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }


[dev-dependencies]
# Reading back the words the published artefact is written in, in the one test that
# holds them to the contract's own spelling. Nothing this crate ships serialises.
serde_json = "1"

[lints]
workspace = true
