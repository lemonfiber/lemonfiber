[package]
name = "lemonfiber-plugin"
version.workspace = true
license-file = "../../LICENSE"
publish = false
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# The bundled stack's manifest as one text, for the names a plugin may not take.
lemonfiber-bundled = { workspace = true }
# The stack description, for the one thing the vocabulary cannot state about itself:
# which bundled services declare each capability. The direction is one-way — nothing
# in `lemonfiber-manifest` may reach back here, or the two would be a cycle.
lemonfiber-manifest = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
# The generated schema is a JSON document, and holding a manifest to it means reading
# that document.
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
# A recipe's call address is built with it, when the manifest is read and when the call
# is made, so the two are one reading.
url = { workspace = true }

[lints]
workspace = true
