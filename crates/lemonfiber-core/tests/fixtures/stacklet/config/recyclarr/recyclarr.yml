# A stand-in Recyclarr config for the materialise tests: the same shape as the
# shipped one, carrying the Balanced includes, so the default selection rewrites
# it to itself and a chosen preset rewrites its include lists.

sonarr:
  series:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY

    include:
      - config: /config/includes/sonarr-web-1080p.yml

radarr:
  films:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY

    include:
      - config: /config/includes/radarr-hd-bluray-web.yml
