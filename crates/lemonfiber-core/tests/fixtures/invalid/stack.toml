# A manifest that parses and contradicts itself, so the load path can be shown
# to report contents faults rather than only syntax ones.
schema_version  = 1
stack_version   = "1.0.0"
min_cli_version = "0.1.0"
include = ["services/jellyfin.toml"]

[[profile]]
id = "media"
name = "Library"
description = "Serving what you have"

[[form]]
id = "library"
name = "Library"
description = "Serve what exists."
profiles = ["media", "telly"]
