[package]
name = "lemonfiber-core"
version.workspace = true
license-file = "../../LICENSE"
publish = false
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
lemonfiber-error = { workspace = true }
lemonfiber-manifest = { workspace = true }
# The plugin manifest types, the capability vocabulary and the extension points —
# the three things this crate generates a published artefact from. One way only:
# nothing there reaches back here, which is what lets it be read with no stack.
lemonfiber-plugin = { workspace = true }
lemonfiber-ports = { workspace = true }
argon2 = { workspace = true }
ring = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
jiff = { workspace = true }
crc32fast = { workspace = true }
include_dir = { workspace = true }
form_urlencoded = { workspace = true }
futures-util = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Confined to `stack/mounts.rs`.
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
chacha20poly1305 = { workspace = true }

[dev-dependencies]
lemonfiber-error = { workspace = true, features = ["testing"] }
# The fakes both this crate's own tests and its integration tests drive the real code
# through. It depends on `lemonfiber-ports` alone, so there is no cycle back to here.
lemonfiber-fixtures = { workspace = true }
# The real seams, for the tests that mean this machine — a scratch directory on a real
# disk rather than a fake that would be asserting its own behaviour. A dev-dependency
# only: the whole point of the extraction is that a released `lemonfiber-core` cannot
# reach the network. It depends on `lemonfiber-ports` alone, so this is not a cycle.
lemonfiber-adapters = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
