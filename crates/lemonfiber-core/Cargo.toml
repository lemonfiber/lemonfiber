[package]
name = "lemonfiber-core"
version.workspace = true
license-file = "../../LICENSE"
publish = false
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
lemonfiber-contract = { workspace = true }
# The bundled stack's manifest as one text, for the vocabulary its services publish.
lemonfiber-bundled = { workspace = true }
# A plugin's tree, digested as the bundle pins it, for first-party trust.
lemonfiber-bundle = { workspace = true }
lemonfiber-error = { workspace = true }
lemonfiber-manifest = { workspace = true }
# The plugin manifest types, the capability vocabulary and the extension points —
# the three things this crate generates a published artefact from. One way only:
# nothing there reaches back here, which is what lets it be read with no stack.
lemonfiber-plugin = { workspace = true }
lemonfiber-ports = { workspace = true }
lemonfiber-sidecar = { workspace = true }
argon2 = { workspace = true }
regex = { workspace = true }
ring = { workspace = true }
x509-parser = { workspace = true }
ciborium-ll = { workspace = true }
ciborium-io = { workspace = true }
# The certificate the web surface presents to a paired phone, and reading its key back.
rcgen = { workspace = true }
# The PKCS#12 the media server's internal TLS port is served from.
p12-keystore = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
jiff = { workspace = true }
crc32fast = { workspace = true }
include_dir = { workspace = true }
form_urlencoded = { workspace = true }
url = { workspace = true }
futures-util = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Confined to `project/overlay.rs` and `project/document.rs`.
serde_norway = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
chacha20poly1305 = { workspace = true }

[target.'cfg(unix)'.dependencies]
# The flags that refuse to open the keys' hold through a link or to wait on a pipe;
# confined to `keys/held.rs`.
libc = { workspace = true }

[dev-dependencies]
lemonfiber-error = { workspace = true, features = ["testing"] }
# The fakes both this crate's own tests and its integration tests drive the real code
# through. It depends on `lemonfiber-ports` alone, so there is no cycle back to here.
lemonfiber-fixtures = { workspace = true }
lemonfiber-testing = { workspace = true }
# The real seams, for the tests that mean this machine — a scratch directory on a real
# disk rather than a fake that would be asserting its own behaviour. A dev-dependency
# only: the whole point of the extraction is that a released `lemonfiber-core` cannot
# reach the network. It depends on `lemonfiber-ports` alone, so this is not a cycle.
lemonfiber-adapters = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "test-util"] }
# A bundled claim as the stack writes it, for the tests that judge one: the stack's own
# reader keeps each claim as the TOML table it found.
toml = { workspace = true }
# The door's cases, judged by a guard matching the media server's declared patterns.

[lints]
workspace = true
