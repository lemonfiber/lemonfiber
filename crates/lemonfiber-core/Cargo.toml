[package]
name = "lemonfiber-core"
version.workspace = true
license-file = "../../LICENSE"
publish = false
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# Proving a Usenet provider means opening a real, TLS-wrapped NNTP connection —
# rustls rather than the platform's TLS, so the static musl release stays free of a
# system TLS library. Bundled Mozilla roots, for the same reason: a static binary
# carries its own trust anchors. Confined to `adapters/nntp.rs`.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
webpki-roots = "1"
lemonfiber-manifest = { path = "../lemonfiber-manifest" }
lemonfiber-ports = { path = "../lemonfiber-ports" }
async-trait = { workspace = true }
bollard = { workspace = true }
crc32fast = "1"
getrandom = { workspace = true }
include_dir = { workspace = true }
reqwest = { workspace = true }
form_urlencoded = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = "1"
# Compose files are YAML, and the single-mount rule can only be read from them —
# it is invisible to every probe, since from the host the data root is one
# filesystem and hardlinks work perfectly. A parser rather than line-matching,
# because anchors, merge keys and both volume syntaxes all have to read the way
# Compose reads them. Confined to `stack/mounts.rs`.
serde_yaml_ng = "0.10"
sysinfo = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
