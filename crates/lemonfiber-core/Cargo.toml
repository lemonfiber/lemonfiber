[package]
name = "lemonfiber-core"
version.workspace = true
license-file = "../../LICENSE"
publish = false
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
lemonfiber-manifest = { path = "../lemonfiber-manifest" }
lemonfiber-ports = { path = "../lemonfiber-ports" }
argon2 = { workspace = true }
async-trait = { workspace = true }
jiff = { workspace = true }
crc32fast = "1"
include_dir = { workspace = true }
form_urlencoded = { workspace = true }
futures-util = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = "1"
# Compose files are YAML, and the single-mount rule can only be read from them —
# it is invisible to every probe, since from the host the data root is one
# filesystem and hardlinks work perfectly. A parser rather than line-matching,
# because anchors, merge keys and both volume syntaxes all have to read the way
# Compose reads them. Confined to `stack/mounts.rs`.
serde_yaml_ng = "0.10"
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# The fakes both this crate's own tests and its integration tests drive the real code
# through. It depends on `lemonfiber-ports` alone, so there is no cycle back to here.
lemonfiber-fixtures = { path = "../lemonfiber-fixtures" }
# The real seams, for the tests that mean this machine — a scratch directory on a real
# disk rather than a fake that would be asserting its own behaviour. A dev-dependency
# only: the whole point of the extraction is that a released `lemonfiber-core` cannot
# reach the network. It depends on `lemonfiber-ports` alone, so this is not a cycle.
lemonfiber-adapters = { path = "../lemonfiber-adapters" }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
