[package]
name = "lemonfiber-adapters"
description = "The implementations of lemonfiber's ports that reach the world outside this process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license-file = "../../LICENSE"
# Never published: it is the half of the product that touches the machine, and what it
# implements is a boundary this workspace owns rather than an interface anybody else codes
# against.
publish = false

[dependencies]
# The boundary only, and deliberately not `lemonfiber-core`. Everything here is an
# implementation of a port, so the trait it satisfies is the whole of what it needs to
# know — and depending on the core would make the core's dependency on this a cycle,
# which is what keeps a container runtime, an HTTP client and a TLS stack out of a crate
# that must not be able to reach the network at all.
lemonfiber-ports = { workspace = true }
lemonfiber-error = { workspace = true }
async-trait = { workspace = true }
bollard = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
reqwest = { workspace = true }
# Docker writes what it remembers about contexts as JSON; confined to
# `docker/context.rs`.
serde_json = { workspace = true }
base64 = { workspace = true }
# The NNTP proof's TLS stack; confined to `nntp.rs`.
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }

[dev-dependencies]
lemonfiber-fixtures = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "test-util", "macros"] }

[lints]
workspace = true
