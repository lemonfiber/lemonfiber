[package]
name = "lemonfiber-adapters"
description = "The implementations of lemonfiber's ports that reach the world outside this process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license-file = "../../LICENSE"
# Never published: it is the half of the product that touches the machine, and what it
# implements is a boundary this workspace owns rather than an interface anybody else codes
# against.
publish = false

[dependencies]
# The boundary only, and deliberately not `lemonfiber-core`. Everything here is an
# implementation of a port, so the trait it satisfies is the whole of what it needs to
# know — and depending on the core would make the core's dependency on this a cycle,
# which is what keeps a container runtime, an HTTP client and a TLS stack out of a crate
# that must not be able to reach the network at all.
lemonfiber-ports = { path = "../lemonfiber-ports" }
async-trait = { workspace = true }
bollard = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
reqwest = { workspace = true }
# Proving a Usenet provider means opening a real, TLS-wrapped NNTP connection — rustls
# rather than the platform's TLS, so the static musl release stays free of a system TLS
# library. Bundled Mozilla roots, for the same reason: a static binary carries its own
# trust anchors. Confined to `nntp.rs`.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"
sysinfo = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }

[dev-dependencies]
lemonfiber-fixtures = { path = "../lemonfiber-fixtures" }
lemonfiber-ports = { path = "../lemonfiber-ports" }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "test-util", "macros"] }

[lints]
workspace = true
