# A whole stack manifest the validator's tests edit, kept apart from the shipped stack.
# Schema: https://github.com/lemonfiber/spec/blob/main/20-architecture/contracts/stack-manifest.md
# Every field here is consumed by lemonfiber; adding a service is a data change.

schema_version  = 1
stack_version   = "0.1.0"
min_cli_version = "0.1.0"

# Each service is described in a file of its own, in the order listed here.
# The list alone decides what the stack holds (ARCH-R171).
include = [
  "services/prowlarr.toml",
  "services/flaresolverr.toml",
  "services/nzbhydra2.toml",
  "services/sabnzbd.toml",
  "services/gluetun.toml",
  "services/qbittorrent.toml",
  "services/sonarr.toml",
  "services/radarr.toml",
  "services/lidarr.toml",
  "services/bindery.toml",
  "services/bazarr.toml",
  "services/jellyfin.toml",
  "services/door.toml",
  "services/seerr.toml",
  "services/request-gate.toml",
  "services/decline.toml",
  "services/calibre-web-automated.toml",
  "services/audiobookshelf.toml",
  "services/navidrome.toml",
  "services/recyclarr.toml",
  "services/unpackerr.toml",
  "services/homepage.toml",
  "services/caddy.toml",
]

# ─────────────────────────── Profiles (one per service's role) ───────────────
[[profile]]
id = "search"
name = "Indexers"
description = "Finding things"

[[profile]]
id = "usenet"
name = "Usenet"
description = "Usenet downloading"
protocol = "usenet"

[[profile]]
id = "torrent"
name = "Torrents"
description = "Torrent downloading, VPN-isolated"
protocol = "torrent"

[[profile]]
id = "tv"
name = "Television"
description = "TV automation"

[[profile]]
id = "movies"
name = "Movies"
description = "Film automation"

[[profile]]
id = "music"
name = "Music"
description = "Music automation"

[[profile]]
id = "books"
name = "Books"
description = "Book and audiobook automation"

[[profile]]
id = "subs"
name = "Subtitles"
description = "Subtitle automation"

[[profile]]
id = "media"
name = "Library"
description = "Serving what you have"

[[profile]]
id = "tuning"
name = "Tuning"
description = "Quality profiles and extraction"

[[profile]]
id = "dash"
name = "Dashboard"
description = "A page linking everything"

[[profile]]
id = "proxy"
name = "Proxy"
description = "Friendly hostnames"

# ─────────────────────────── Forms (named slices) ────────────────────────────
[[form]]
id = "search"
name = "Search"
description = "Find things. Nothing else runs."
profiles = ["search"]

[[form]]
id = "dl"
name = "Download"
description = "You have a link — fetch it."
profiles = ["usenet", "torrent"]

[[form]]
id = "hunt"
name = "Hunt"
description = "Search and grab, manually."
profiles = ["search", "usenet", "torrent"]

[[form]]
id = "tv"
name = "TV"
description = "Search, download and automate television"
profiles = ["search", "usenet", "torrent", "tv", "subs"]

[[form]]
id = "movies"
name = "Movies"
description = "Search, download and automate film"
profiles = ["search", "usenet", "torrent", "movies", "subs"]

[[form]]
id = "music"
name = "Music"
description = "Search, download and automate music"
profiles = ["search", "usenet", "torrent", "music"]

[[form]]
id = "books"
name = "Books"
description = "Search, download and automate books and audiobooks"
profiles = ["search", "usenet", "torrent", "books"]

[[form]]
id = "auto"
name = "Auto"
description = "Everything automated, nothing served"
profiles = ["search", "usenet", "torrent", "tv", "movies", "music", "books", "subs", "tuning"]

[[form]]
id = "library"
name = "Library"
description = "Serve what exists. Requires no third-party accounts."
profiles = ["media"]

[[form]]
id = "full"
name = "Full"
description = "The lot."
profiles = ["search", "usenet", "torrent", "tv", "movies", "music", "books", "subs", "media", "tuning", "dash"]

[[form]]
id = "proxy"
name = "Proxy"
description = "Friendly hostnames. Layers onto any other form."
profiles = ["proxy"]

# ─────────────────────────── Wiring (what reaches what) ─────────────────────
# `provides` above says what each service can do. This says what reaches what,
# and whether the link is an ask for a capability or a name.
#
# Every entry names the service the link runs *from* in `by`, which is what a
# report calls the asker when nothing fills what it asked for. An ask names a
# capability; `each = true` means it reaches every service that fills it rather
# than the one that does. A by-name link uses `to` and carries the reason it is
# by name, because the point of writing it here is that the exception is visible
# rather than assumed to be an oversight.
#
# What is deliberately absent: the dashboard's panels and the proxy's routes.
# Homepage and Caddy do not ask anything — lemonfiber writes both files from the
# tier and the description each service already declares, which is generation
# rather than wiring, and a plugin's service is given the same on the same terms.
# The request gate has none either: it is how lemonfiber carries Seerr's asks to
# Sonarr, Radarr and Jellyfin, not a capability of its own, so Seerr's wiring is
# what states those links (ADR-0032 §5). qBittorrent's link to the tunnel is not
# here either: `network = { via = "network.egress-guard" }` on its own service
# asks for whatever fills that capability and runs inside its network.

# ── Asks ─────────────────────────────────────────────────────────────────────
# The links lemonfiber makes, when it seeds. Each is written against what the
# far end does rather than what it is called, so a service that stands in for
# one of these is reached by everything that asked, with nothing else changed.

[[wiring]]
by = "sonarr"
asks = "download.usenet"

[[wiring]]
by = "sonarr"
asks = "download.torrent"

[[wiring]]
by = "radarr"
asks = "download.usenet"

[[wiring]]
by = "radarr"
asks = "download.torrent"

[[wiring]]
by = "lidarr"
asks = "download.usenet"

[[wiring]]
by = "lidarr"
asks = "download.torrent"

[[wiring]]
by = "prowlarr"
asks = "library.curate"
each = true

[[wiring]]
by = "prowlarr"
asks = "indexer.proxy"

[[wiring]]
by = "bindery"
asks = "download.usenet"

[[wiring]]
by = "bindery"
asks = "download.torrent"

[[wiring]]
by = "bindery"
asks = "indexer.search"
filled_by = "prowlarr"
why = "Two services here answer as an indexer and this asks for one of them. Prowlarr is the stack's choice because it is the one the book *arr can pull a keyed feed from; NZBHydra2 searches Usenet only. Change it and everything that asked follows."

[[wiring]]
by = "seerr"
asks = "identity.source"

[[wiring]]
by = "seerr"
asks = "library.curate"
each = true

[[wiring]]
by = "bazarr"
asks = "library.curate"
each = true

[[wiring]]
by = "jellyfin"
asks = "dashboard.show"

# ── By name ──────────────────────────────────────────────────────────────────
# Seven links that are genuinely about one service each, and say so.

[[wiring]]
by = "unpackerr"
to = "sonarr"
why = "The image is configured per application — UN_SONARR_0_URL and its key — and what it knows is Sonarr, not whatever curates a library. The link is spelled in the service's own terms, so it is about that service."

[[wiring]]
by = "unpackerr"
to = "radarr"
why = "The same, in Radarr's terms."

[[wiring]]
by = "unpackerr"
to = "lidarr"
why = "The same, in Lidarr's terms."

[[wiring]]
by = "recyclarr"
to = "sonarr"
why = "It writes Sonarr-shaped quality profiles from Sonarr-shaped guides, into a section of its own configuration named for the service. Nothing about it generalises to a library curator."

[[wiring]]
by = "recyclarr"
to = "radarr"
why = "The same, in Radarr's terms."

[[wiring]]
by = "decline"
to = "jellyfin"
why = "It makes three of Jellyfin's own calls, reading an account and its activity log and writing the account's policy back disabled, with a key lemonfiber minted for it alone. What it acts on is Jellyfin, not whatever serves identity."

[[wiring]]
by = "door"
to = "jellyfin"
why = "It asks Jellyfin's own question, an item fetched with the session a request presents, and passes what it lets through to Jellyfin's own routes, which it names path by path. What it guards is Jellyfin, not whatever serves media."

# ─────────────────────────── Removed (1) ─────────────────────────────────────
# What the catalogue used to carry, why it went, and what took the job over. A
# service that leaves takes its description with it, and what is left is a
# manifest that no longer mentions it — which says nothing about whether it was
# replaced, renamed or abandoned. The operator who asks "didn't something here do
# books?" deserves an answer that outlives the entry.
#
# `removed_in` is the stack version whose catalogue no longer carries the
# service, which is why Readarr names 0.1.0: upstream discontinued it while the
# first stack was being assembled, so it never shipped in a published one. The
# value is not a claim that it did.

[[removed]]
id = "readarr"
removed_in = "0.1.0"
reason = "Discontinued upstream in 2025. Its repository is archived, so the pin could only ever age."
replaced_by = "bindery"
