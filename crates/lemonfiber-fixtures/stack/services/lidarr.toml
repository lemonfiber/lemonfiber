takes_data = true
user_mode = "puid-env"

[[service.claim]]
capability = "library.curate"

[[service.claim.probe]]
id = "guarded"
request = { method = "GET", path = "/api/v1/wanted/missing" }
expect = { status = 401 }
fixture = "recordings/lidarr/library-curate-guarded.json"

[[service.claim.probe]]
id = "wanted"
request = { method = "GET", path = "/api/v1/wanted/missing" }
expect = { status = 200, json_types = { records = "list", totalRecords = "int" } }
fixture = "recordings/lidarr/library-curate-wanted.json"
