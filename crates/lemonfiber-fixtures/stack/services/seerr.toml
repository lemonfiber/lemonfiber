[[service]]
id = "seerr"
name = "Seerr"
profile = "media"
image = "ghcr.io/seerr-team/seerr"
tag = "v3.5.0"
digest = "sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45"
port = 5055
bind = "lan"
criticality = "important"
memory_mib = 250
license = "MIT"
upstream = "https://github.com/seerr-team/seerr"
last_release = "2026-09-28"
describes = "Where the household asks for things"
without_it = "Requests come to you in person"
reaches = "the metadata provider it lists titles from"
asks_for = "Reads the catalogue the household browses and requests from, and the artwork beside it."
provides = ["request.intake"]
health = { kind = "http", path = "/api/v1/status", timeout_s = 90 }
# Its key can be fetched over its own API, and it also writes it to this file,
# which is the cheaper read and the one lemonfiber takes. The path is where the
# service keeps it inside its own container — Seerr's config mount is beneath
# its application directory rather than at /config like the rest.
api = { kind = "seerr", key_source = "config-json", path = "/app/config/settings.json" }
listens = 5055
user_mode = "uid"
config_path = "/app/config"

[service.env]
LOG_LEVEL = { setting = "seerr:log-level", default = "info" }

[[service.claim]]
capability = "request.intake"

[[service.claim.probe]]
id = "identifies"
request = { method = "GET", path = "/api/v1/status" }
expect = { status = 200, json_types = { version = "str", commitTag = "str" } }
fixture = "recordings/seerr/request-intake-identifies.json"

[[service.claim.probe]]
id = "guarded"
request = { method = "GET", path = "/api/v1/request" }
expect = { status = 401 }
fixture = "recordings/seerr/request-intake-guarded.json"
