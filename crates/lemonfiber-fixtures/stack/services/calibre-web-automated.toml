[[service]]
id = "calibre-web-automated"
name = "Calibre-Web-Automated"
profile = "media"
image = "crocodilestick/calibre-web-automated"
tag = "V3.1.4"
digest = "sha256:577e846f104fd21453ef306eefb4a95dd95b3b9ddd2463a150944494284da0fd"
port = 8083
bind = "lan"
criticality = "enhancing"
memory_mib = 300
license = "GPL-3.0-only"
upstream = "https://github.com/crocodilestick/Calibre-Web-Automated"
last_release = "2026-02-04"
describes = "Reading and organising your ebook library"
without_it = "No ebook reader"
reaches = "book metadata providers"
asks_for = "Reads covers and descriptions for the ebooks in your library when you ask it to."
provides = ["media.serve"]
health = { kind = "http", path = "/", timeout_s = 90 }
takes_data = true
user_mode = "puid-env"

[[service.claim]]
capability = "media.serve"

[[service.claim.probe]]
id = "guarded"
request = { method = "GET", path = "/opds" }
expect = { status = 401 }
fixture = "recordings/calibre-web-automated/media-serve-guarded.json"

[[service.claim.probe]]
id = "catalogue"
request = { method = "GET", path = "/ajax/listbooks" }
expect = { status = 200, json_types = { rows = "list", total = "int" } }
fixture = "recordings/calibre-web-automated/media-serve-catalogue.json"
