# SABnzbd writes the rest of this file itself on first run. Only the settings it
# cannot be left to choose are here, and it merges them with its own defaults.
__version__ = 19

[misc]
# The name the other services reach it by.
#
# SABnzbd refuses any request whose Host header is a name it does not recognise,
# and a fresh install recognises only the container's own generated hostname —
# so Sonarr, Radarr and Lidarr, which address it as `sabnzbd`, are all answered
# with 403. The *arr reports that as "unable to connect", which sends whoever is
# debugging it looking at the network instead of at this list.
#
# Names that are an IP address, `localhost`, or that end in `.local` are accepted
# without being listed. A compose service alias is none of those.
host_whitelist = sabnzbd,

# The categories the *arrs hand their downloads to.
#
# SABnzbd supplies its own on first run — `movies`, `tv`, `audio`, `software` — and
# two of the three an *arr asks for happen to be among them. The music one is not:
# Lidarr is told to file under `music`, and SABnzbd refuses a download client whose
# category it does not hold, with "Category does not exist". So the two that match by
# luck are left to its defaults and the one that does not is declared here.
#
# `dir` is empty deliberately: SABnzbd then files under the category's own name below
# the complete directory, which is what the *arr expects to collect from.
#
# Guarded by `check_configs.py`, which reads the media types the manifest declares and
# fails where SABnzbd would hold no category for one of them.
[categories]
[[books]]
name = books
order = 6
pp = ""
script = Default
dir = ""
newzbin = ""
priority = -100
[[music]]
name = music
order = 5
pp = ""
script = Default
dir = ""
newzbin = ""
priority = -100
