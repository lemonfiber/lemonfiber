# Homepage information widgets — the strip along the top of the page.

- resources:
    cpu: true
    memory: true
    expanded: true

# Disk usage is deliberately absent. Homepage takes no data mount: it is
# published to the LAN, and mounting the whole library into a LAN-facing web app
# to render a free-space gauge is a trade the default should not make for you.
#
# To enable it, give it a read-only mount of the data root in overlay.yml beside
# lemonfiber's settings —
#
#     services:
#       homepage:
#         volumes:
#           - /your/data/root:/data:ro
#
# — keeping it to exactly one mount beneath the data root, then add `disk: /data`
# to the resources widget above. One figure covers downloads and library both,
# which is the point: on this stack they are one filesystem.

- search:
    provider: duckduckgo
    target: _blank
