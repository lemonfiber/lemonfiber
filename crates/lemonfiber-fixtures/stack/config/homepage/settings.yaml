# Homepage — one page linking everything, with live status.
#
# Homepage is published to the LAN. HOMEPAGE_ALLOWED_HOSTS in .env lists the
# Host headers it will answer for — set it to the addresses the household
# actually types, e.g. `homepage.local:3000,192.168.1.10:3000`.

title: Lemonfiber
description: The house media stack

headerStyle: clean
statusStyle: dot
hideVersion: true

# Groups are laid out in the order services.yaml declares them.
layout:
  Watch:
    style: row
    columns: 4
  Library:
    style: row
    columns: 3
  Automation:
    style: row
    columns: 4
  Acquisition:
    style: row
    columns: 4
