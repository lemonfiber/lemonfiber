[package]
name = "lemonfiber-fixtures"
description = "The fakes lemonfiber's tests drive the real code through."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license-file = "../../LICENSE"
# Never published: it exists so the crate's own tests and its integration tests reach the
# same fakes, and it ships nothing.
publish = false

[dependencies]
# The boundary only. Depending on `lemonfiber-core` would be a dev-dependency cycle: Cargo
# builds that crate twice, once plain and once under `cfg(test)`, and a fake implementing
# one copy's trait is not the other copy's. That cycle is why these fakes existed twice.
lemonfiber-ports = { path = "../lemonfiber-ports" }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
# The stub half of the filesystem fake is asserted rather than assumed, and those
# assertions are async because the port is.
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
