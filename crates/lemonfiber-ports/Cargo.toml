[package]
name = "lemonfiber-ports"
description = "The boundary lemonfiber speaks to the outside world across, and the vocabulary that crosses it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license-file = "../../LICENSE"
# Not published, as `lemonfiber-manifest` is not: the release ships one binary, and a
# crate nobody can depend on separately is one fewer surface to keep compatible.
publish = false

[dependencies]
lemonfiber-manifest = { path = "../lemonfiber-manifest" }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true
