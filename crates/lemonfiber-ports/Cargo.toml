[package]
name = "lemonfiber-ports"
description = "The boundary lemonfiber speaks to the outside world across, and the vocabulary that crosses it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license-file = "../../LICENSE"
# Not published, as `lemonfiber-manifest` is not: the release ships one binary, and a
# crate nobody can depend on separately is one fewer surface to keep compatible.
publish = false

[dependencies]
lemonfiber-manifest = { path = "../lemonfiber-manifest" }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
# The tests round-trip a stage through its serialised form, which is the only place the
# `serde` derives above are actually proven.
serde_json = "1"

[lints]
workspace = true
