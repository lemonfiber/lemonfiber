[package]
name = "lemonfiber-conformance"
description = "Whether a plugin's adapters answer the contracts they speak, judged from the recordings it ships."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license-file = "../../LICENSE"
# Not published: the release ships one binary.
publish = false

[dependencies]
lemonfiber-contract = { workspace = true }
lemonfiber-ports = { workspace = true }
async-trait = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
