[package]
name = "lemonfiber"
version = "0.0.0"
license-file = "../../LICENSE"
publish = false
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "lemonfiber"
path = "src/main.rs"

[build-dependencies]
lemonfiber-manifest = { path = "../lemonfiber-manifest" }

[dependencies]
lemonfiber-core = { path = "../lemonfiber-core" }
clap = { workspace = true }
etcetera = { workspace = true }
color-eyre = { workspace = true }
include_dir = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
