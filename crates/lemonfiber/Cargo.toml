[package]
name = "lemonfiber"
version.workspace = true
license-file = "LICENSE"
publish = false
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Orchestrates a fully open-source, self-hosted media stack"
homepage = "https://lemonfiber.app"

# The binary is not published to crates.io (`publish = false`), but it IS the
# artifact every release ships. `dist = true` tells cargo-dist to build and
# distribute it despite that — without it dist sees no distributable package.
[package.metadata.dist]
dist = true

[[bin]]
name = "lemonfiber"
path = "src/main.rs"

[build-dependencies]
lemonfiber-manifest = { path = "../lemonfiber-manifest" }

[dependencies]
lemonfiber-core = { path = "../lemonfiber-core" }
# The endpoints and the app the web surface serves. Only this crate starts a
# server; the core cannot, and the api crate does not choose an address.
lemonfiber-api = { path = "../lemonfiber-api" }
axum = { workspace = true }
clap = { workspace = true }
etcetera = { workspace = true }
color-eyre = { workspace = true }
include_dir = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time"] }
async-trait = { workspace = true }
# Reading a secret without echoing it needs raw-terminal control, which this
# workspace forbids doing directly (`unsafe_code = "forbid"`); rpassword wraps it.
rpassword = "7"
# Turning the front door's address into something a phone camera reads. Chosen over
# the alternatives for having no optional dependencies at all — `qrcode` can pull in
# `image` and `fast_qr` can pull in `resvg`, and a QR code is a grid of bits that
# needs neither. It hands back exactly that grid, one module at a time, and leaves
# every decision about how to draw it here where the terminal is known.
qrcodegen = "1.8"
# A backup archive is a gzip-compressed tar: `tar` packs and reads the directory
# trees, `flate2` compresses them. flate2's default `miniz_oxide` backend is pure
# Rust, so the static musl release stays free of a system zlib the way rustls keeps
# it free of system TLS. Reading free space before a capture is `sysinfo`, the same
# crate the storage diagnostic already uses to measure a volume.
flate2 = "1"
tar = "0.4"
sysinfo = { workspace = true }
# Reading and writing the manifest that rides inside the archive. The type and its
# derives live in the core; this only turns it to and from the bytes tar stores.
serde_json = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

[dev-dependencies]
# The fakes the ports are driven through, shared with every other crate's tests
# rather than written again here.
lemonfiber-fixtures = { path = "../lemonfiber-fixtures" }
# Reading the embedded stack's own declaration of itself. Already a build
# dependency, and a build dependency is not on a test target's path.
lemonfiber-manifest = { path = "../lemonfiber-manifest" }
# Driving a router without a socket, so what a route answers is checked as a fact
# rather than by starting a server to ask it.
tower = { version = "0.5", features = ["util"] }
# Moving the clock a serving surface looks at the policy on, so a test proves the
# looking rather than waiting for it. The feature is a test one and is declared here
# rather than beside the runtime, so nothing shipped can reach it.
tokio = { workspace = true, features = ["test-util"] }
# Reading the two declarations the privacy guards check against each other — the
# resolved dependency graph in `Cargo.lock`, and cargo-deny's ban list. Both are
# TOML, and a hand-rolled reader for either would be a second opinion about what
# they say. Already in the tree via the manifest parser.
toml = { workspace = true }

[lints]
workspace = true
