[package]
name = "lemonfiber"
version.workspace = true
license-file = "../../LICENSE"
publish = false
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Orchestrates a fully open-source, self-hosted media stack"
homepage = "https://lemonfiber.app"

# The binary is not published to crates.io (`publish = false`), but it IS the
# artifact every release ships. `dist = true` tells cargo-dist to build and
# distribute it despite that — without it dist sees no distributable package.
[package.metadata.dist]
dist = true

[[bin]]
name = "lemonfiber"
path = "src/main.rs"

[build-dependencies]
lemonfiber-manifest = { path = "../lemonfiber-manifest" }

[dependencies]
lemonfiber-core = { path = "../lemonfiber-core" }
clap = { workspace = true }
etcetera = { workspace = true }
color-eyre = { workspace = true }
include_dir = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time"] }
# Proving a Usenet provider means opening a real, TLS-wrapped NNTP connection —
# rustls (already in the tree via reqwest) rather than the platform's TLS, so the
# static musl release stays free of a system TLS library. Bundled Mozilla roots,
# for the same reason: a static binary carries its own trust anchors.
async-trait = { workspace = true }
# Reading a secret without echoing it needs raw-terminal control, which this
# workspace forbids doing directly (`unsafe_code = "forbid"`); rpassword wraps it.
rpassword = "7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
webpki-roots = "1"
# A backup archive is a gzip-compressed tar: `tar` packs and reads the directory
# trees, `flate2` compresses them. flate2's default `miniz_oxide` backend is pure
# Rust, so the static musl release stays free of a system zlib the way rustls keeps
# it free of system TLS. Reading free space before a capture is `sysinfo`, the same
# crate the storage diagnostic already uses to measure a volume.
flate2 = "1"
tar = "0.4"
sysinfo = { workspace = true }
# Reading and writing the manifest that rides inside the archive. The type and its
# derives live in the core; this only turns it to and from the bytes tar stores.
serde_json = "1"

[lints]
workspace = true
