[package]
name = "lemonfiber"
version.workspace = true
license-file = "LICENSE"
publish = false
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Orchestrates a fully open-source, self-hosted media stack"
homepage = "https://lemonfiber.app"

# The binary is not published to crates.io (`publish = false`), but it IS the
# artifact every release ships. `dist = true` tells cargo-dist to build and
# distribute it despite that — without it dist sees no distributable package.
[package.metadata.dist]
dist = true

[[bin]]
name = "lemonfiber"
path = "src/main.rs"

[build-dependencies]
lemonfiber-manifest = { workspace = true }
# Reading the wire version the embedded app and the contract each declare.
serde_json = { workspace = true }

[dependencies]
lemonfiber-adapters = { workspace = true }
lemonfiber-core = { workspace = true }
# The endpoints and the app the web surface serves. Only this crate starts a
# server; the core cannot, and the api crate does not choose an address.
lemonfiber-api = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
etcetera = { workspace = true }
color-eyre = { workspace = true }
include_dir = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time"] }
async-trait = { workspace = true }
rpassword = { workspace = true }
qrcodegen = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
sysinfo = { workspace = true }
# Reading and writing the manifest that rides inside a backup archive. The type and
# its derives live in the core; this only turns it to and from the bytes tar stores.
serde_json = { workspace = true }
ratatui = { workspace = true }

[dev-dependencies]
lemonfiber-error = { workspace = true, features = ["testing"] }
# The fakes the ports are driven through, shared with every other crate's tests
# rather than written again here.
lemonfiber-fixtures = { workspace = true }
# Reading the embedded stack's own declaration of itself. Already a build
# dependency, and a build dependency is not on a test target's path.
lemonfiber-manifest = { workspace = true }
# Driving a router without a socket, so what a route answers is checked as a fact
# rather than by starting a server to ask it.
tower = { workspace = true, features = ["util"] }
# Moving the clock a serving surface looks at the policy on, so a test proves the
# looking rather than waiting for it. The feature is a test one and is declared here
# rather than beside the runtime, so nothing shipped can reach it.
tokio = { workspace = true, features = ["test-util"] }
# Reading the two declarations the privacy guards check against each other — the
# resolved dependency graph in `Cargo.lock`, and cargo-deny's ban list. Both are
# TOML, and a hand-rolled reader for either would be a second opinion about what
# they say. Already in the tree via the manifest parser.
toml = { workspace = true }
# The architecture checks: the syntax tree they read the code as, and the lexer the
# comment rules read comments with.
syn = { workspace = true }
rustc_lexer = { workspace = true }

[lints]
workspace = true
