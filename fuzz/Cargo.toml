# Fuzz targets for what arrives from outside: a stack manifest, a plugin manifest,
# the parameters and the headers a request to the web API carries, the environment
# file, compose files, and a backup archive read back.
#
# Deliberately its own workspace: the fuzz harness is built with a nightly
# toolchain and a sanitizer, and it must not inherit the strict lint set the
# main workspace forbids code under (`panic`, `unwrap_used`, `indexing_slicing`)
# — a fuzz target's whole job is to reach those paths, not to avoid them.
[package]
name = "lemonfiber-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license-file = "../LICENSE"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

serde_json = "1"
flate2 = "1"
tokio = { version = "1", features = ["rt"] }

[dependencies.lemonfiber]
path = "../crates/lemonfiber"

[dependencies.lemonfiber-api]
path = "../crates/lemonfiber-api"

[dependencies.lemonfiber-core]
path = "../crates/lemonfiber-core"

[dependencies.lemonfiber-manifest]
path = "../crates/lemonfiber-manifest"

[dependencies.lemonfiber-plugin]
path = "../crates/lemonfiber-plugin"

# Fuzzing wants the optimiser on and debug assertions kept, so an overflow or a
# failed invariant aborts loudly instead of wrapping quietly.
[profile.release]
debug = true
debug-assertions = true
overflow-checks = true

[[bin]]
name = "manifest_from_toml"
path = "fuzz_targets/manifest_from_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_validate"
path = "fuzz_targets/manifest_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "date_parse"
path = "fuzz_targets/date_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plugin_from_toml"
path = "fuzz_targets/plugin_from_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api_read_query"
path = "fuzz_targets/api_read_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api_action_arguments"
path = "fuzz_targets/api_action_arguments.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api_guard"
path = "fuzz_targets/api_guard.rs"
test = false
doc = false
bench = false

[[bin]]
name = "env_file"
path = "fuzz_targets/env_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compose_mounts"
path = "fuzz_targets/compose_mounts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_restore"
path = "fuzz_targets/archive_restore.rs"
test = false
doc = false
bench = false

[workspace]
