# The scripts in `scripts/` are the release gates. `verify_release_workflow`
# decides whether a tagged build can be trusted, `the_installer_places_what_it_
# verified` decides whether the shell script a user pipes into their machine
# installs the binary it checked, `the_toolchain_a_job_gets` decides whether a
# job tests the compiler the manifest promises — and nothing read them.
#
# Several carry a `--self-test` that drives each claim against a tree that has
# lost it, which is the harder half. This is the easier half and it was missing:
# a name that does not exist, an import a rewrite left behind, two strings in a
# list that a missing comma has silently joined.
#
# The settings lemonfiber/spec holds its own gate scripts to, for the same
# reason it holds them: a mistake in the thing that enforces correctness is the
# one mistake nothing else will catch.
target-version = "py312"

line-length = 110

[lint]
# The floor, and the reasoning for each rule, live in
# `lemonfiber/spec`'s `shared/ruff.toml`, which `check_shared_files.py` holds
# this copy to: every rule below has to stay selected, and nothing may be
# added to `ignore` that the shared file does not already ignore.
select = ["E", "W", "F", "B", "I", "SIM", "UP", "RUF", "EXE", "FURB", "ISC"]

ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "E501",
]

[format]
docstring-code-format = true
