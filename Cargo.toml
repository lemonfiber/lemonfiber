[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.82"
repository = "https://github.com/lemonfiber/lemonfiber"
authors = ["NightWorks.io"]

# Versions are declared once here so the three crates cannot drift onto
# different minors of the same dependency. See spec 30-repos/lemonfiber.md.
[workspace.dependencies]
async-trait = "0.1"
bollard = "0.21"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
etcetera = "0.10"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt", "sync", "time"] }
tokio-stream = "0.1"
toml = "0.9"

# Strict, zero-suppression posture — see spec 40-quality/code-standards.md (Q-R11, Q-R12).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }

# Release engineering — cargo-dist. See spec 70-operations/releasing.md.
# The authoritative release.yml is generated by `dist init && dist generate`
# at milestone M6; the config below is the intended shape.
[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
ci = "github"
installers = ["shell", "powershell", "homebrew"]
tap = "lemonfiber/homebrew-tap"
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
publish-jobs = ["homebrew"]
github-attestations = true   # SLSA build provenance (OPS-R20)
