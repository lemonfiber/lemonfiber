[workspace]
resolver = "2"
members = ["crates/*"]
# The fuzz harness is its own workspace: it builds on nightly with a sanitizer
# and must not inherit the lints below, since reaching a panic is its purpose.
exclude = ["fuzz"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
repository = "https://github.com/lemonfiber/lemonfiber"
authors = ["NightWorks.io"]

# Versions are declared once here so the three crates cannot drift onto
# different minors of the same dependency. See spec 30-repos/lemonfiber.md.
[workspace.dependencies]
async-trait = "0.1"
bollard = "0.21"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
etcetera = "0.10"
# The operating system's CSPRNG, for the one secret lemonfiber generates itself:
# qBittorrent's WebUI password. 0.2 is already in the tree via rustls.
getrandom = "0.2"
include_dir = "0.7"
# rustls, not the platform's TLS: it keeps the musl static release target free of
# an OpenSSL build dependency. json for decoding service API responses.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
serde = { version = "1", features = ["derive"] }
# Building qBittorrent's form-encoded request bodies. Infallible — it returns a
# String, not a Result — so there is no error to invent for inputs that cannot
# fail to encode. Already in the tree via reqwest's url dependency.
form_urlencoded = "1"
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt", "sync", "time"] }
tokio-stream = "0.1"
toml = "0.9"

# Strict, zero-suppression posture — see spec 40-quality/code-standards.md (Q-R11, Q-R12).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "lemonfiber/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
# Windows (x86_64-pc-windows-msvc) is deferred: the native binary does not yet
# compile — docker.rs needs a bollard named-pipe path and filesystem.rs uses the
# nightly-only file_index(). Tracked as L1/M10 work before 1.0.0.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Whether to enable GitHub Attestations
github-attestations = true
# cargo-dist's plan step creates a draft Release and uploads artifacts to it;
# with this false it does not create a *published* one from scratch. It still ends
# by un-drafting (`--draft=false`), which `just release-workflow` flips back to
# `--draft=true` so the tag leaves a DRAFT a maintainer publishes (OPS-R1). Always
# regenerate release.yml via `just release-workflow`, never by hand.
create-release = false
# release.yml carries our one hand-applied patch (the `--draft=true` above), so
# tell cargo-dist not to fail its up-to-date check on it. `just release-workflow`
# keeps the rest in sync.
allow-dirty = ["ci"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
