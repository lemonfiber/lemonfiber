[workspace]
resolver = "2"
members = ["crates/*"]
# The fuzz harness is its own workspace: it builds on nightly with a sanitizer
# and must not inherit the lints below, since reaching a panic is its purpose.
exclude = ["fuzz"]

[workspace.package]
version = "0.16.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/lemonfiber"
authors = ["NightWorks.io"]

# Every dependency, the workspace's own crates included, is declared here and
# nowhere else: a crate names what it uses with `workspace = true` and adds only
# features. `deny.toml` refuses a second version of any crate, so a declaration
# here that differs from what the graph already carries fails rather than drifts.
[workspace.dependencies]
lemonfiber-adapters = { path = "crates/lemonfiber-adapters" }
lemonfiber-api = { path = "crates/lemonfiber-api" }
lemonfiber-core = { path = "crates/lemonfiber-core" }
lemonfiber-error = { path = "crates/lemonfiber-error" }
lemonfiber-fixtures = { path = "crates/lemonfiber-fixtures" }
lemonfiber-manifest = { path = "crates/lemonfiber-manifest" }
lemonfiber-plugin = { path = "crates/lemonfiber-plugin" }
lemonfiber-ports = { path = "crates/lemonfiber-ports" }
lemonfiber-testing = { path = "crates/lemonfiber-testing" }
schemars = "1.2"
async-trait = "0.1"
# Argon2id for the one password lemonfiber verifies rather than reads: the operator's
# own, in front of the web surface. Memory-hard, so an attacker's advantage is bounded
# by memory bandwidth rather than by how many cores they can rent. Its own randomness
# feature is left off — the salt comes through the port every other secret does.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
# The web surface's router. Default features pull in a URL query parser, tracing and
# websockets, none of which this API has; what is left is routing, HTTP/1 and JSON,
# which is the whole of what the contract describes.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
# The Engine API client. `ssh` is on because a remote Docker context is nearly always an
# ssh:// one, and without it the client cannot connect at all while `docker compose` — a
# subprocess with an inherited environment — happily can: reads on one machine, writes on
# another. The feature was measured against the reason the `reqwest` line below picks
# rustls, and it is clean: it pulls `openssh`, which drives the operator's own `ssh`
# binary, and three small crates with it. No OpenSSL, so the static musl release target
# still builds without a system TLS library.
bollard = { version = "0.21", features = ["ssh"] }
# Wall-clock arithmetic in a named zone, for the one window this product holds against a
# time of day: the hours an operator does not want waking for. Everything else here is
# instants and calendar days on purpose. Its own tzdb is left to the platform's, so the
# zone the stack already names in `TZ` is read from the same database the containers use.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-zoneinfo"] }
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
etcetera = "0.11"
# The operating system's CSPRNG, for every secret lemonfiber mints itself.
getrandom = "0.4"
include_dir = "0.7"
# rustls, not the platform's TLS: it keeps the musl static release target free of
# an OpenSSL build dependency. json for decoding service API responses.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
serde = { version = "1", features = ["derive"] }
# Building qBittorrent's form-encoded request bodies. Infallible — it returns a
# String, not a Result — so there is no error to invent for inputs that cannot
# fail to encode. Already in the tree via reqwest's url dependency.
form_urlencoded = "1"
# `join_all`, for running the independent per-service work a seed or a doctor run
# does at once rather than in series — its wall-clock then tracks the slowest
# service, not their sum. Only the combinator is taken (no executor); already in
# the tree via reqwest, so this adds no crate to the graph.
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-stream = "0.1"
# The service traits axum's own router is built on, so a test can call the assembled
# router directly instead of putting a socket between itself and an endpoint. Already
# in the tree via axum; only the combinators are taken.
tower = { version = "0.5", default-features = false }
toml = "1.1"
# Decoding the base64 a PEM key and a registry's signature are carried in. The 0.22
# line is the one reqwest and bollard use.
base64 = "0.23"
# Encrypting what the store keeps at rest.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
crc32fast = "1"
# A backup archive is a gzip-compressed tar. flate2's default `miniz_oxide` backend
# is pure Rust, so the static musl release needs no system zlib.
flate2 = "1"
# Turning the front door's address into something a phone camera reads. It has no
# optional dependencies: a QR code is a grid of bits, and drawing it is left to the
# terminal code that knows the terminal.
qrcodegen = "1.8"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# Verifying the signature a registry offers beside an image, with the library rustls
# already builds on.
ring = "0.17"
# Reading a secret without echoing it needs raw-terminal control, which
# `unsafe_code = "forbid"` rules out doing directly.
rpassword = "7"
# Proving a Usenet provider means a real TLS-wrapped NNTP connection. rustls with
# bundled Mozilla roots, so the static musl release carries its own trust anchors.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
# rustc's own lexer, for the checks that read comments: what counts as a comment is
# decided the way the compiler decides it.
rustc_lexer = { package = "ra-ap-rustc_lexer", version = "0.174" }
serde_json = "1"
# Compose files are YAML, and the single-mount rule can only be read from them. A
# parser rather than line-matching, because anchors, merge keys and both volume
# syntaxes have to read the way Compose reads them.
serde_yaml_ng = "0.10"
# The syntax tree the architecture checks read the code as, on the line the
# workspace's proc macros already build on.
syn = { version = "3", default-features = false, features = ["clone-impls", "full", "parsing", "printing", "visit"] }
tar = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"

# Strict, zero-suppression posture — see spec 40-quality/code-standards.md.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
# The one lint here that is off, because its fix cannot be written: it asks for
# `Duration::from_hours` and its siblings, which are unstable on every stable
# compiler (`duration_constructors`). Clippy offers the suggestion because it
# believes them available at the `rust-version` this workspace names.
duration_suboptimal_units = "allow"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Only the shell installer. Homebrew needs a HOMEBREW_TAP_TOKEN to push to the
# tap, and PowerShell installs the Windows binary, which is not a target.
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
# Windows is not a target: the native binary does not compile. What it waits on is
# a register in `what_windows_is_waiting_on.rs`, held to this list by a test: the
# target may be added here exactly when that register is empty.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
# No publish jobs: nothing is published to the Homebrew tap.
publish-jobs = []
# cargo-dist creates and PUBLISHES the GitHub Release on a tag. Governance
# wants a tag to leave a DRAFT a maintainer publishes, and cargo-dist has no config
# for that, so `just release-workflow` patches the generated `gh release create` to
# add `--draft`. allow-dirty stops cargo-dist's up-to-date check from failing CI on
# that patch (it also makes `dist generate` skip release.yml, which the recipe
# toggles around). Regenerate ONLY via `just release-workflow`, never by hand.
# Whether to enable GitHub Attestations
github-attestations = true
allow-dirty = ["ci"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# The profile that 'dist' will build with
# Debug information is line tables and nothing more.
#
# The default is full DWARF, and this workspace links around a hundred test binaries
# against it — so a large part of what a build writes to disk, and much of what a link
# spends its time on, is debug information for a debugger nobody here attaches. What
# these tests are actually read beside is a panic naming the file and the line it
# happened on, and line tables are exactly that.
#
# Coverage is unaffected: `cargo llvm-cov` maps counters through the coverage map the
# instrumentation writes, not through DWARF.
#
# What it costs is stepping through a running process with variable inspection. That is
# worth having when you need it and worth paying for only then — `CARGO_PROFILE_DEV_DEBUG=2`
# for the one session that needs it, rather than for every build that does not.
[profile.dev]
debug = "line-tables-only"

[profile.dist]
inherits = "release"
lto = "thin"
