[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
# Two families are refused as dependencies rather than merely avoided as a habit,
# and both are stems: a family is published under one prefix, and banning the one
# somebody reaches for first would leave the rest.
#
# The first exists to report somewhere. The second can load a unit of code or
# evaluate a program handed to it at runtime, which is how a plugin would stop
# being data — the property everything about extensions rests on.
#
# The same stems are swept over the resolved graph by the guards in
# `crates/lemonfiber/tests/refused/`, which match a family by its prefix where this
# matches one name at a time, and which hold this list to theirs. Add to both or
# neither.
deny = [
  "amplitude",
  "aptabase",
  "bugsnag",
  "countly",
  "datadog",
  "google-analytics",
  "libhoney",
  "mixpanel",
  "opentelemetry",
  "posthog",
  "rollbar",
  "segment",
  "sentry",
  "snowplow",
  "abi_stable",
  "dlopen",
  "libloading",
  "sharedlib",
  "boa_engine",
  "deno_core",
  "dyon",
  "extism",
  "gluon",
  "hlua",
  "koto",
  "lua",
  "mlua",
  "quickjs",
  "rhai",
  "rlua",
  "rquickjs",
  "rustpython",
  "starlark",
  "v8",
  "wasm3",
  "wasmedge",
  "wasmer",
  "wasmi",
  "wasmtime",
]

[licenses]
version = 2
# Permissive licences we accept for dependencies. Our own crate is Hippocratic
# (license-file), which does not constrain what deps may use.
# CDLA-Permissive-2.0 covers webpki-roots — Mozilla's CA root bundle that rustls
# trusts by default. It is a permissive data licence for the certificate set, not
# code we link, and carries no copyleft or attribution burden.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Our own workspace crates are Hippocratic (license-file); cargo-deny's
# licence gate is for third-party deps, not first-party code.
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
