[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
# Telemetry is refused as a dependency, not merely avoided as a habit. These are
# stems of crate families that exist to report somewhere; the same list is swept
# over the resolved graph by `nothing_reports_on_you.rs`, which matches a family
# by its prefix where this matches one name at a time. Add to both or neither.
deny = [
  "amplitude",
  "aptabase",
  "bugsnag",
  "countly",
  "datadog",
  "google-analytics",
  "libhoney",
  "mixpanel",
  "opentelemetry",
  "posthog",
  "rollbar",
  "segment",
  "sentry",
  "snowplow",
]

[licenses]
version = 2
# Permissive licences we accept for dependencies. Our own crate is Hippocratic
# (license-file), which does not constrain what deps may use.
# CDLA-Permissive-2.0 covers webpki-roots — Mozilla's CA root bundle that rustls
# trusts by default. It is a permissive data licence for the certificate set, not
# code we link, and carries no copyleft or attribution burden.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Our own workspace crates are Hippocratic (license-file); cargo-deny's
# licence gate is for third-party deps, not first-party code.
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
