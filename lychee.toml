# Link checking, for the hygiene gate the spec repo defines.
#
# The gate runs `lychee .` over this tree, and lychee skips hidden directories
# unless told otherwise — so the links in `.docs/` were not being checked, and
# the check was green because it had found nothing to check.
#
# `.git` is excluded because turning hidden files on lets lychee walk it, and
# what it holds is compressed objects rather than documents.
hidden = true
exclude_path = [".git"]

# Retries, because a link check that fails on one slow host teaches people to
# re-run it rather than to read it.
max_retries = 2

# There is deliberately no `accept` list here.
#
# There was one — `["200", "206", "429"]` — and it never ran. The shared hygiene
# workflow passes `--accept` on the command line, and a command-line argument
# beats a config file, so this file's list was decoration. It happened to be
# identical to the one that ran, which is why nobody noticed it was dead.
#
# That is the worse half of the duplication: not two values disagreeing, but two
# values agreeing while only one is consulted. Somebody editing this one to fix a
# failing link check would watch it keep failing and have no idea why.
#
# The list lives in `lemonfiber/spec`'s `hygiene.yml`, which is also where the
# reasoning for each accepted code is written.
exclude_loopback = true

# One URL is not checked: the OSI licence list, named in
# `crates/lemonfiber-manifest/src/spdx_osi.txt` as where to confirm an identifier.
# opensource.org answers GitHub's runners `403` on some runs and `200` on others, from
# the same commit, so the gate went red on pull requests that touched no link. A 403
# cannot be accepted for one host alone — lychee's `hosts` table sets headers and
# pacing, not status codes, and the accept list that runs is the shared one — so this
# is the narrowest exception there is: that one address, anchored at both ends, and
# every other link on the host and everywhere else still checked. The pattern spells
# its separators as character classes because this file is itself checked, and a
# plain address inside it would be read as a link.
exclude = ['^https:[/][/]opensource[.]org[/]license$']
