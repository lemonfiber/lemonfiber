# How a release's notes are written from the commits that made it.
#
# The bullet carries the plain-language summary first and the identifiers after
# it (E5-R9), and every commit reaches a group whether or not it cites anything
# (E5-R5). The `Spec:` trailer every commit in this repository already carries is
# what turns an entry into something traceable: the identifiers are deduplicated
# and sorted here, and `scripts/the_requirements_an_entry_names.py` — run over
# this output by `.github/workflows/release-changelog.yml` — groups them under the
# feature each belongs to and links the page that defines them (E5-R3).
#
# The two halves are split that way because a URL cannot be built from an
# identifier alone: which file defines `A6-R7` is a fact only the spec tree holds,
# and this repository does not vendor it. Left un-rewritten the entry is still
# correct and still readable, which is what makes `git cliff` on its own a useful
# thing to run by hand.
[changelog]
header = "# Changelog\n\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | upper_first }}
{% for commit in commits %}
{%- set trailers = commit.footers | filter(attribute="token", value="Spec") -%}
{%- set spec = trailers | map(attribute="value") | join(sep=", ") | split(pat=", ") | unique | sort -%}
- {{ commit.message | split(pat="\n") | first | upper_first }}{% if trailers | length %} — {{ spec | join(sep=", ") }}{% endif %}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^ci", group = "<!-- 6 -->Continuous integration" },
  { message = "^build", group = "<!-- 7 -->Build system" },
  { message = "^chore", group = "<!-- 8 -->Chores" },
  { message = ".*", group = "<!-- 9 -->Other" },
]
