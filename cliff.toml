# How the history is read, and what a bare `git cliff` prints from it.
#
# The release pipeline no longer renders from the template below. It asks for
# `--context` — git-cliff's own parse of the history, tag by tag, with the
# conventional type and the trailers already taken apart — and
# `scripts/the_record_a_release_leaves.py` turns that into the record every
# release page is then written from. Which is why the `[git]` half matters most
# here: `filter_unconventional = false` and the `.*` parser are what guarantee
# every commit reaches the reader, and the groups below are what the record maps
# onto the four an operator is offered.
#
# The template stays because a bare `git cliff` is a useful thing to run by hand,
# and what it prints should be recognisable. It cannot be what ships: an
# identifier says nothing about which page defines it, and a bullet cannot name
# the release it shipped in from inside a single tag's own section.
[changelog]
header = "# Changelog\n\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | upper_first }}
{% for commit in commits %}
{%- set trailers = commit.footers | filter(attribute="token", value="Spec") -%}
{%- set spec = trailers | map(attribute="value") | join(sep=", ") | split(pat=", ") | unique | sort -%}
- {{ commit.message | split(pat="\n") | first | upper_first }}{% if trailers | length %} — {{ spec | join(sep=", ") }}{% endif %}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^ci", group = "<!-- 6 -->Continuous integration" },
  { message = "^build", group = "<!-- 7 -->Build system" },
  { message = "^chore", group = "<!-- 8 -->Chores" },
  { message = ".*", group = "<!-- 9 -->Other" },
]
