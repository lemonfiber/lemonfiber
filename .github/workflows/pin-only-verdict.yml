# pin-only's verdict (Q-R83, Q-R84): from the default branch, when the relay in
# `pin-only.yml` completes, it judges the pull request through the API and posts
# `pin-only / pin-only` on its head. One runs at a time for a branch.
name: pin-only verdict
on:
  workflow_run:
    workflows: [pin-only]
    types: [completed]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  verdict:
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
    uses: lemonfiber/spec/.github/workflows/pin-only.yml@f60d147988899bcb7a3422d132d8985992bf77a4 # v1.0.156
