name: build
on: [pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # The contract page lives in the spec and this repo does not vendor it, so
      # the one check that reads both trees needs both trees. Same repository,
      # same ref and same path the governance gate uses, for one answer to where
      # the canonical spec is.
      - name: Check out the canonical spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lemonfiber/spec
          ref: main
          path: .spec-canonical
          persist-credentials: false
      # Before the toolchain, because it needs none and costs a second: a page
      # that no longer describes this surface is worth saying in the first
      # minute rather than after a build.
      - name: The contract page names the reads we serve
        run: python3 scripts/reads_match_the_contract.py --spec .spec-canonical
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings
      # The tests are not run here. `sonar` runs every one of them to measure coverage,
      # and these two jobs run at the same time — so a second execution shortened
      # nothing and cost a full codegen and link of around a hundred test binaries,
      # which is work `clippy --all-targets` does not do and this job otherwise avoids
      # entirely. What is left here is the two answers that arrive faster than a test
      # run can: how it is written, and what it warns about.
  # `rust-version` in the root manifest is a promise about who can build this from
  # source. This is what collects on it, on the exact toolchain that number names:
  # every other job here runs on stable, which compiles plenty the oldest supported
  # version will not.
  # Before anything builds, because it needs no toolchain and answers the question
  # every job below depends on: whether the compiler each one asks for is the one it
  # will actually run.
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the yaml reader
        run: |
          python3 -m pip install --quiet --disable-pip-version-check \
            --require-hashes -r .github/requirements/yaml.txt
      - name: Every job runs the compiler it asks for
        run: python3 scripts/the_toolchain_a_job_gets.py
      # A claim nobody has watched fail is a claim nobody knows works.
      - name: Every claim refuses the tree that has lost it
        run: python3 scripts/the_toolchain_a_job_gets.py --self-test

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # Read rather than restated. The version this job collects on is the one the
      # workspace promises, and a copy of it here is a copy that can disagree — which
      # is invisible, because a job checking the wrong compiler still passes.
      - name: The version the workspace promises
        id: promised
        run: |
          version="$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          if [ -z "$version" ]; then
            echo "::error file=Cargo.toml::no rust-version is declared, so there is no promise to collect on"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The pin names the tag the commit was resolved from; what gets installed is
      # the input, and what gets *run* is the override below.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95.0
        with:
          toolchain: ${{ steps.promised.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `RUSTUP_TOOLCHAIN` takes precedence over `rust-toolchain.toml`, which would
      # otherwise hand this job the pinned toolchain — and a job silently checking the
      # version everything else already checks passes for the wrong reason forever.
      # Printed for the same reason: the version in the log is what makes it visible.
      - name: The workspace builds on the version it promises
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.promised.outputs.version }}
        run: |
          rustc --version
          cargo check --workspace --locked
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # The record the binary carries is generated, and a generated file that is
  # committed is a file somebody can edit. This is what makes that visible: the
  # record is written again from the history and compared with the one in the tree.
  #
  # What is compared is what the tags decide — which releases there are, and what
  # each of them changed. The feature a requirement belongs to and the page it is
  # defined on move on the specification's own clock, so comparing those would call
  # the record stale every time a page was retitled.
  #
  # Being behind is not a fault and does not fail. Between a tag and the refresh
  # that follows it a release exists whose notes are not written yet, which is where
  # every release leaves the trunk; that is reported as a notice. What fails is the
  # record naming a release the repository has no tag for, or saying something
  # different about one it does — the two ways a kept file can contradict what
  # shipped.
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag, because the record is every release rather than the last one.
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the canonical spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lemonfiber/spec
          ref: main
          path: .spec-canonical
          persist-credentials: false
      - name: The record holds its own claims
        run: python3 scripts/the_record_a_release_leaves.py --self-test
      # Fetched and checked against a digest rather than taken on trust, the same
      # way `release-changelog` takes it and for the same reason.
      - name: Take git-cliff, and check it is the one asked for
        env:
          CLIFF: "2.14.1"
          DIGEST: cba6ae86f0a4205784eed8ef049fe53c904138806e33a1bda2e25026b17198eb
        run: |
          set -euo pipefail
          archive="git-cliff-${CLIFF}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$archive" \
            "https://github.com/orhun/git-cliff/releases/download/v${CLIFF}/${archive}"
          echo "${DIGEST}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive"
          sudo install "git-cliff-${CLIFF}/git-cliff" /usr/local/bin/git-cliff
      - name: The committed record still describes what the tags say shipped
        run: |
          set -euo pipefail
          git-cliff --config cliff.toml --context > context.json
          python3 scripts/the_record_a_release_leaves.py \
            --spec .spec-canonical --check reference/changelog.json < context.json
