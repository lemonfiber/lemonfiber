name: build
on: [pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # The contract page lives in the spec and this repo does not vendor it, so
      # the one check that reads both trees needs both trees. Same repository,
      # same ref and same path the governance gate uses, for one answer to where
      # the canonical spec is.
      - name: Check out the canonical spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lemonfiber/spec
          ref: main
          path: .spec-canonical
          persist-credentials: false
      # Before the toolchain, because it needs none and costs a second: a page
      # that no longer describes this surface is worth saying in the first
      # minute rather than after a build.
      - name: The contract page names the reads we serve
        run: python3 scripts/reads_match_the_contract.py --spec .spec-canonical
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings
      - uses: taiki-e/install-action@75a348306ce8f67c0b06fc62c32a8546140ba955 # nextest
        with:
          tool: cargo-nextest
      # Against each other rather than one after another. Around a hundred test binaries
      # live here and `cargo test` runs them in series; measured on one machine that is
      # 134s against 391s. No doctests are lost — every doctest target here reports zero.
      - name: Test
        run: cargo nextest run --workspace
  # `rust-version` in the root manifest is a promise about who can build this from
  # source. This is what collects on it, on the exact toolchain that number names:
  # every other job here runs on stable, which compiles plenty the oldest supported
  # version will not.
  msrv:
    runs-on: ubuntu-latest
    # Takes precedence over `rust-toolchain.toml`, which would otherwise hand this job
    # the pinned toolchain — and a job that silently checks the version everything else
    # already checks is a job that passes for the wrong reason forever.
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95.0
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Printed, because the failure this job can have is being handed a different
      # toolchain and passing quietly. A version in the log is what makes that visible.
      - name: The toolchain this job is actually holding
        run: rustc --version
      - name: The workspace builds on the version it claims
        run: cargo check --workspace --locked
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
