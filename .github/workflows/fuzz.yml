# Fuzzing for the manifest crate (Q-R63).
#
# `stack.toml` is the one file users are invited to edit by hand, so malformed
# input is ordinary rather than adversarial — and the parser must answer with a
# diagnostic, never a panic. These targets exist to find the inputs nobody
# thought to write a test for.
#
# Two modes. Every pull request that touches the parser or the harness builds
# the targets and gives each a short smoke run, which is enough to catch a
# regression that crashes immediately without slowing review down. The weekly
# run is the one that actually explores, and it keeps its corpus between runs
# so each week starts where the last left off rather than from nothing.
name: fuzz
on:
  pull_request:
    paths:
      - "crates/lemonfiber-manifest/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [manifest_from_toml, manifest_validate, date_parse]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # cargo-fuzz builds with a sanitizer, which needs the nightly compiler.
      # The crate itself is still built and shipped on stable; nothing here
      # changes what the product is compiled with.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Restoring the corpus is best-effort: the first ever run has none, and a
      # week's findings are worth carrying forward but not worth failing over.
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Build the target
        run: cargo fuzz build ${{ matrix.target }}

      # A short run on pull requests, a long one on the weekly schedule. -runs
      # caps iterations so a pull request cannot hang on a target that happens
      # to be fast.
      - name: Fuzz
        env:
          SECONDS_TO_RUN: ${{ github.event_name == 'pull_request' && '60' || '900' }}
        run: |
          cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time="${SECONDS_TO_RUN}" \
            -max_len=65536 \
            -print_final_stats=1

      # A crash is the point of the exercise, so the input that caused it has to
      # survive the job that found it.
      - name: Upload crash artefacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

      - name: Save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
