# `release.yml` is generated by `dist generate` and then rewritten: the release is
# left as a draft, every installer is checked against a pinned digest, every
# action is pinned to a commit, and the token that can write a release belongs to
# the one job that writes one. `just release-workflow` applies all of it.
#
# Regenerating that file without the recipe drops every patch at once, and the
# result still builds, signs and publishes. This reads the file in the tree and
# says so before it merges.
name: release-workflow
on: [pull_request]
permissions:
  contents: read

jobs:
  verify:
    # The check this produces, and the one branch protection names.
    name: release-workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the yaml reader
        run: python3 -m pip install --quiet --disable-pip-version-check "pyyaml==6.0.2"

      - name: The release workflow still carries every patch
        run: python3 scripts/verify_release_workflow.py

      # A claim nobody has watched fail is a claim nobody knows works.
      - name: Every claim refuses the tree that has lost it
        run: python3 scripts/verify_release_workflow.py --self-test
