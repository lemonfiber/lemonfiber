# Put the commit-level changelog on the release the tag produced.
#
# `release.yml` is generated by cargo-dist and is rewritten wholesale by
# `just release-workflow`, so nothing may be added to it by hand. It writes the
# release body from its own manifest — install instructions, the artifact table
# and the attestation notes — and that is the whole body. The changelog the old
# hand-written pipeline generated was lost the day cargo-dist replaced it, and
# every release since has shipped install boilerplate as its only notes.
#
# This runs after that workflow finishes, while the release is still a draft, and
# rewrites the body as the changelog followed by what cargo-dist wrote. Both
# survive, the maintainer reviews the real notes before publishing, and the
# announcement that fires on publish leads with what changed.
#
# `workflow_run` rather than a `release` trigger: GitHub fires no release event
# for a draft, and the two workflows already listening for `published`
# (release-announce, release-record) read the body out of the event payload, so a
# body written at publish time would reach neither.
#
# Two jobs, because `workflow_run` carries a write token. `changelog` reads the
# tagged tree and can write nothing; `publish` holds the write grant and checks
# out no code at all, taking the changelog as an artifact. Whatever a tag
# contains, it is never read by the half that can act on the repository.
name: release-changelog

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  changelog:
    # The generated workflow also runs on every pull request; only a successful
    # tag push produced a release to write to. And only one from this repository:
    # a `workflow_run` fires for a fork's run too, and while the checkout below
    # takes a tag from here rather than from there, refusing the run outright is
    # the shorter thing to be sure of.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Settle the tag
        id: tag
        env:
          REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # The generated workflow's tag filter is a glob wide enough to match
          # things that are not versions; this one is the release shape exactly.
          if printf '%s' "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag=${REF}" >> "$GITHUB_OUTPUT"
            echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${REF} is not a release tag; nothing to write."
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the tagged tree
        if: steps.tag.outputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Generate the changelog (git-cliff)
        if: steps.tag.outputs.tag != ''
        id: cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Hand it on as data
        if: steps.tag.outputs.tag != ''
        env:
          CHANGELOG: ${{ steps.cliff.outputs.content }}
        run: |
          set -euo pipefail
          mkdir -p notes
          printf '%s\n' "$CHANGELOG" > notes/changelog.md
          if ! grep -q '[^[:space:]]' notes/changelog.md; then
            echo "::error::git-cliff found no commits for this tag."
            exit 1
          fi
          echo "generated $(wc -l < notes/changelog.md) lines."

      - name: Upload it
        if: steps.tag.outputs.tag != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-changelog
          path: notes/changelog.md

  publish:
    needs: changelog
    if: needs.changelog.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Take the changelog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-changelog
          path: notes

      - name: Write it above what cargo-dist wrote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.changelog.outputs.tag }}
          VERSION: ${{ needs.changelog.outputs.version }}
        run: |
          set -euo pipefail
          # Found by id over the listing rather than by tag: a draft release is
          # not yet attached to its tag, so the by-tag endpoint cannot see it,
          # and the listing returns drafts to a token with push access. One page
          # rather than --paginate into head, which would leave gh writing to a
          # closed pipe; the draft is the newest release there is.
          id=$(gh api "repos/${REPO}/releases?per_page=100" \
            --jq '[.[] | select(.tag_name == env.TAG) | .id] | first // empty')
          if [ -z "$id" ]; then
            echo "::error::no release found for ${TAG}."
            exit 1
          fi

          # The marker is where a previous run of this workflow put the boundary.
          # Splitting on it rather than appending makes a re-run idempotent: what
          # is kept is always cargo-dist's half.
          marker='<!-- the changelog is above; cargo-dist wrote what follows -->'
          gh api "repos/${REPO}/releases/${id}" --jq '.body // ""' > installers.md
          if grep -qxF "$marker" installers.md; then
            awk -v m="$marker" 'keep { print } $0 == m { keep = 1 }' installers.md \
              | sed '/./,$!d' > kept.md
            mv kept.md installers.md
          fi

          {
            printf '## What changed in %s\n\n' "$VERSION"
            cat notes/changelog.md
            printf '\n%s\n\n' "$marker"
            cat installers.md
          } > body.md

          jq -n --rawfile body body.md '{body: $body}' > payload.json
          gh api --method PATCH "repos/${REPO}/releases/${id}" --input payload.json >/dev/null
          echo "wrote $(wc -l < notes/changelog.md) lines of changelog onto ${TAG}."
