# Calls the reusable workflows defined once in lemonfiber/spec (Q-R56).
name: ci
on: [pull_request]
permissions:
  contents: read

jobs:
  spec-check:
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@a32ee06e5b7eb5366a0a50db1ed2b0c5f380303a # main
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@61f5205b9db1699ba58dc007b23924a7e566de76 # main
  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@61f5205b9db1699ba58dc007b23924a7e566de76 # main
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@61f5205b9db1699ba58dc007b23924a7e566de76 # main
  commitlint:
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@61f5205b9db1699ba58dc007b23924a7e566de76 # main
  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@61f5205b9db1699ba58dc007b23924a7e566de76 # main
