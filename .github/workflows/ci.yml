# Calls the reusable workflows defined once in lemonfiber/spec (Q-R56).
name: ci
on: [pull_request]
permissions:
  contents: read

jobs:
  spec-check:
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@7084ff5150708d594a409521dc60113350d480fc # main
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@7084ff5150708d594a409521dc60113350d480fc # main
  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@7084ff5150708d594a409521dc60113350d480fc # main
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@7084ff5150708d594a409521dc60113350d480fc # main
  commitlint:
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@7084ff5150708d594a409521dc60113350d480fc # main
  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@7084ff5150708d594a409521dc60113350d480fc # main
