# Calls the reusable workflows defined once in lemonfiber/spec (Q-R56).
name: ci
on: [pull_request]
permissions:
  contents: read

jobs:
  spec-check:
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@4eb85bd0ffafb9ed804bd78b23221a2bdb99db91 # main
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@4eb85bd0ffafb9ed804bd78b23221a2bdb99db91 # main
  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@4eb85bd0ffafb9ed804bd78b23221a2bdb99db91 # main
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@4eb85bd0ffafb9ed804bd78b23221a2bdb99db91 # main
  commitlint:
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@4eb85bd0ffafb9ed804bd78b23221a2bdb99db91 # main
  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@4eb85bd0ffafb9ed804bd78b23221a2bdb99db91 # main
