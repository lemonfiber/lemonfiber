# Calls the reusable workflows defined once in lemonfiber/spec (Q-R56).
name: ci
on: [pull_request]
permissions:
  contents: read

jobs:
  # `pull-requests: write` is what lets the gate close a pull request whose
  # citation is missing or names an identifier that does not exist, rather than
  # only going red at it. The workflow-level `contents: read` above is the
  # default for a job that declares nothing; a job-level block replaces that
  # default outright, so `contents: read` is restated here rather than inherited.
  spec-check:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@36315d8edbda398bca06f752a904bca981263de8 # main
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@36315d8edbda398bca06f752a904bca981263de8 # main
  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@36315d8edbda398bca06f752a904bca981263de8 # main
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@36315d8edbda398bca06f752a904bca981263de8 # main
  commitlint:
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@36315d8edbda398bca06f752a904bca981263de8 # main
  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@36315d8edbda398bca06f752a904bca981263de8 # main
