# Publish the machine-readable contract with the release that produced it.
#
# Every SDK generates its types from this artefact rather than transcribing the
# shapes. Reaching it should not mean cloning a Rust repo, so each
# release carries it as an asset: the `contract/web-api/` directory as one
# archive, `web-api.contract.tar.gz`.
#
# Separate from `release.yml`, which dist autogenerates and would overwrite.
#
# Onto the draft `release.yml` leaves, before a maintainer publishes it, so that
# nothing about a release changes once it is published: that is what lets the
# repository hold published releases immutable, assets and tag alike.
# `workflow_run` rather than a `release` trigger, since GitHub fires no release
# event for a draft — the same reason `release-changelog` runs this way.
#
# Two jobs, because `workflow_run` carries a write token. `gather` reads the tagged
# tree and can write nothing; `attach` holds the write grant and checks out no code
# at all, taking what `gather` read as an artifact. Whatever a tag contains, it is
# never read by the half that can act on the repository.
name: release-contract

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  gather:
    # The generated workflow also runs on every pull request; only a successful
    # tag push produced a draft to attach to. And only one from this repository:
    # a `workflow_run` fires for a fork's run too.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # The tag reaches `ref:` below, so its shape is settled before anything
      # uses it rather than trusted because of who can push a tag.
      - name: Refuse a tag that is not a version
        id: tag
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::refusing to act on a tag that is not vN.N.N: $TAG"
              exit 1
              ;;
          esac
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Take the tag's own copy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false
          # The stack is a submodule and its manifest is what the step below reads,
          # so a checkout without it would leave the declaration unwritable.
          submodules: true

      - name: Gather the contract
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          contract="contract/web-api"

          # A release without it leaves every SDK unable to sync that version,
          # which is better discovered here than by a consumer.
          if [ ! -s "$contract/index.json" ]; then
            echo "::error::$contract/index.json is missing or empty at $TAG"
            exit 1
          fi

          # Every file is parsed, not only the index: one that is not JSON is a
          # directory no SDK can generate from.
          find "$contract" -type f -name '*.json' -print0 |
            xargs -0 python3 -c 'import json,sys; [json.load(open(f)) for f in sys.argv[1:]]'

          # One archive with the directory at its root, so a consumer takes a
          # release's contract as a single asset and unpacks it as it was committed.
          mkdir -p "$RUNNER_TEMP/attached"
          tar -czf "$RUNNER_TEMP/attached/web-api.contract.tar.gz" -C contract web-api
          echo "gathered $contract from $TAG as web-api.contract.tar.gz"

      # The three a plugin author's tooling reads, on the same terms and for the
      # same reason. An editor validating `plugin.toml`, and a catalogue checking a
      # claim against the vocabulary it was written for, both want the copy generated
      # against the release they are targeting rather than whatever is on the trunk
      # today. The names are unversioned so a consumer can ask a release
      # for a fixed name and get that release's copy.
      - name: Gather what a plugin is authored against
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          for artefact in \
            contract/plugin-manifest.schema.json \
            contract/capability-vocabulary.json \
            contract/adapters.json \
            contract/extension-points.json
          do
            # A release missing one leaves an author's editor with nothing to validate
            # against and a catalogue unable to check a claim, which is better
            # discovered here than by a consumer.
            if [ ! -s "$artefact" ]; then
              echo "::error::$artefact is missing or empty at $TAG"
              exit 1
            fi

            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$artefact"

            cp "$artefact" "$RUNNER_TEMP/attached/"
            echo "gathered $artefact from $TAG"
          done

      # A release says which manifest generation its stack carries, so that a copy
      # reading the release list can tell whether an update brings one it cannot read.
      # The declaration is the *name*: names arrive in the same reply the version is
      # read out of, so an older copy learns this without a second request and without
      # sending anything it was not already sending.
      - name: Declare the stack generation this release carries
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          manifest="assets/media-stack/stack.toml"

          # Read off the stack that actually ships rather than restated here. A number
          # copied into this file is one that goes stale the first time the stack
          # moves, and it would go stale silently.
          if [ ! -s "$manifest" ]; then
            echo "::error::$manifest is missing at $TAG — the submodule was not checked out"
            exit 1
          fi
          schema=$(sed -n 's/^[[:space:]]*schema_version[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$manifest" | head -n 1)
          if [ -z "$schema" ]; then
            echo "::error::$manifest declares no schema_version"
            exit 1
          fi

          # The number, rather than nothing. Only the name is read — the reader
          # strips the prefix off the asset name and never opens the file — so an
          # empty one was the honest shape and it is the one shape that cannot be
          # uploaded: GitHub answers a zero-length body with `HTTP 400: Bad
          # Content-Length`, which is what happened on v0.14.0 and left the
          # release declaring nothing at all. A release that says nothing is
          # answered as unknown rather than as an error, so nobody downstream
          # would have reported it either.
          marker="stack-schema-$schema"
          printf '%s\n' "$schema" > "$RUNNER_TEMP/attached/$marker"
          echo "declared $marker for $TAG"

      - name: Hand it to the half that attaches it
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-contract
          path: ${{ runner.temp }}/attached/
          if-no-files-found: error

  attach:
    needs: gather
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Take what was gathered
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-contract
          path: attached

      - name: Attach it to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.gather.outputs.tag }}
        run: |
          set -euo pipefail
          # Found over the listing rather than by tag: a draft release is not yet
          # attached to its tag, so the by-tag endpoint cannot see it, and the
          # listing returns drafts to a token with push access.
          draft=$(gh api "repos/${REPO}/releases?per_page=100" \
            --jq '[.[] | select(.tag_name == env.TAG) | .draft] | first // empty')
          if [ -z "$draft" ]; then
            echo "::error::no release found for ${TAG}."
            exit 1
          fi
          # Nothing is attached to a release once it is published, so one published
          # before this ran carries no contract, which is better said here than by a
          # consumer.
          if [ "$draft" != "true" ]; then
            echo "::error::${TAG} was published before its contract was attached, and nothing is attached to a published release."
            exit 1
          fi
          gh release upload "$TAG" attached/* --clobber --repo "$REPO"
          for file in attached/*; do
            echo "attached ${file#attached/} to ${TAG}"
          done
