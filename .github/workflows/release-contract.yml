# Publish the machine-readable contract with the release that produced it.
#
# Every SDK generates its types from this artefact rather than transcribing the
# shapes (ARCH-R58). Reaching it should not mean cloning a Rust repo, so each
# release carries it as an asset (ARCH-R64) and an SDK vendors the copy from the
# release it was generated against.
#
# Separate from `release.yml`, which dist autogenerates and would overwrite.
name: release-contract

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tag reaches `ref:` below, so its shape is settled before anything
      # uses it rather than trusted because of who can publish a release.
      - name: Refuse a tag that is not a version
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::refusing to act on a tag that is not vN.N.N: $TAG"
              exit 1
              ;;
          esac
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Take the tag's own copy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false
          # The stack is a submodule and its manifest is what the step below reads,
          # so a checkout without it would leave the declaration unwritable.
          submodules: true

      - name: Attach the contract
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          contract="contract/web-api.contract.json"

          # A release without it leaves every SDK unable to sync that version,
          # which is better discovered here than by a consumer.
          if [ ! -s "$contract" ]; then
            echo "::error::$contract is missing or empty at $TAG"
            exit 1
          fi

          python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$contract"

          gh release upload "$TAG" "$contract" --clobber --repo "$REPO"
          echo "attached $contract to $TAG"

      # The three a plugin author's tooling reads, on the same terms and for the
      # same reason. An editor validating `plugin.toml`, and a catalogue checking a
      # claim against the vocabulary it was written for, both want the copy generated
      # against the release they are targeting rather than whatever is on the trunk
      # today (ARCH-R108). The names are unversioned so a consumer can ask a release
      # for a fixed name and get that release's copy.
      - name: Attach what a plugin is authored against
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for artefact in \
            contract/plugin-manifest.schema.json \
            contract/capability-vocabulary.json \
            contract/extension-points.json
          do
            # A release missing one leaves an author's editor with nothing to validate
            # against and a catalogue unable to check a claim, which is better
            # discovered here than by a consumer.
            if [ ! -s "$artefact" ]; then
              echo "::error::$artefact is missing or empty at $TAG"
              exit 1
            fi

            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$artefact"

            gh release upload "$TAG" "$artefact" --clobber --repo "$REPO"
            echo "attached $artefact to $TAG"
          done

      # A release says which manifest generation its stack carries, so that a copy
      # reading the release list can tell whether an update brings one it cannot read.
      # The declaration is the *name*: names arrive in the same reply the version is
      # read out of, so an older copy learns this without a second request and without
      # sending anything it was not already sending.
      - name: Declare the stack generation this release carries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          manifest="assets/media-stack/stack.toml"

          # Read off the stack that actually ships rather than restated here. A number
          # copied into this file is one that goes stale the first time the stack
          # moves, and it would go stale silently.
          if [ ! -s "$manifest" ]; then
            echo "::error::$manifest is missing at $TAG — the submodule was not checked out"
            exit 1
          fi
          schema=$(sed -n 's/^[[:space:]]*schema_version[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$manifest" | head -n 1)
          if [ -z "$schema" ]; then
            echo "::error::$manifest declares no schema_version"
            exit 1
          fi

          # The number, rather than nothing. Only the name is read — the reader
          # strips the prefix off the asset name and never opens the file — so an
          # empty one was the honest shape and it is the one shape that cannot be
          # uploaded: GitHub answers a zero-length body with `HTTP 400: Bad
          # Content-Length`, which is what happened on v0.14.0 and left the
          # release declaring nothing at all. A release that says nothing is
          # answered as unknown rather than as an error, so nobody downstream
          # would have reported it either.
          marker="stack-schema-$schema"
          printf '%s\n' "$schema" > "$marker"
          gh release upload "$TAG" "$marker" --clobber --repo "$REPO"
          echo "declared $marker on $TAG"
