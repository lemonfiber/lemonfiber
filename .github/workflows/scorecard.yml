# When this repository asks for its supply-chain posture check.
#
# The check itself is lemonfiber/spec's, called rather than copied, so every
# repository runs the one file. Only the triggers live here, because only they are about this
# repository: `branch_protection_rule` and `push` are events that arrive at a
# repository, and a reusable workflow is not a place events arrive.
#
# The call passes `SCORECARD_TOKEN` by name, the one secret the check reads,
# rather than every secret this repository can see. It is an org secret with no
# write scope. Scorecard publishes its result so somebody outside the org can
# read it without being trusted with anything.
name: scorecard

on:
  workflow_dispatch:
  # A change to this repository's protection is a change to its posture, and it
  # is the one event that says so without waiting for the week to turn.
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scorecard:
    permissions:
      # Writing the SARIF back is what puts findings in the security tab.
      security-events: write
      # Scorecard signs its result, so the published entry traces to this run.
      id-token: write
      contents: read
      # Reading the workflow list is how it judges the pipeline itself.
      actions: read
    secrets:
      SCORECARD_TOKEN: ${{ secrets.SCORECARD_TOKEN }}
    uses: lemonfiber/spec/.github/workflows/scorecard.yml@60d130a3d799e4826111f9eeffa932b733bc22c3 # v1.0.16
