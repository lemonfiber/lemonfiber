# The website mirrors this repository — its implementation status, its releases —
# so it is told when they change rather than waiting for its daily schedule.
name: site

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rebuild:
    permissions:
      contents: read
    uses: lemonfiber/spec/.github/workflows/rebuild-site.yml@60d130a3d799e4826111f9eeffa932b733bc22c3 # v1.0.16
    with:
      because: "the tool changed"
    secrets:
      # Only what the dispatch needs: the App key it mints a website-scoped token with.
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
