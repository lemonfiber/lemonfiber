# New issues: label needs-triage, assign the covering maintainer from the
# generated CODEOWNERS, and post to the private maintainer channel, through
# spec's shared triage. OPS-R25, OPS-R27.
name: triage
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: read
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    uses: lemonfiber/spec/.github/workflows/triage.yml@757e680b2ed8d9d8df1f92b730ceea14c3ff873f # v1.0.141
    secrets:
      DISCORD_MAINTAINERS_WEBHOOK: ${{ secrets.DISCORD_MAINTAINERS_WEBHOOK }}
