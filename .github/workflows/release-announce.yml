# Announce a published release to the public #releases channel, mentioning the
# opt-in role when DISCORD_RELEASE_ROLE_ID is set — never @everyone. Fires on
# publish (not draft), so nothing is announced until the release is real. OPS-R23.
name: release-announce
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  announce:
    uses: lemonfiber/spec/.github/workflows/discord-notify.yml@eadb4569c6f5bc88e5278fa68a82d95ddd81b144 # main
    with:
      content: ${{ vars.DISCORD_RELEASE_ROLE_ID && format('<@&{0}>', vars.DISCORD_RELEASE_ROLE_ID) || '' }}
      title: "🍋 Lemonfiber ${{ github.event.release.tag_name }}"
      body: ${{ github.event.release.body }}
      url: ${{ github.event.release.html_url }}
      color: "16309767"
      # #releases is a Forum channel: open a thread per release, named for it.
      thread: "🍋 Lemonfiber ${{ github.event.release.tag_name }}"
    secrets:
      webhook: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
