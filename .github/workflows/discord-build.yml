# Post every workflow run's outcome to the public #build-log channel.
# workflow_run executes in the base repo with the org secret available and never
# in fork-PR code; values reach the reusable as inputs, not shell interpolations.
name: discord-build
on:
  workflow_run:
    workflows: [gates, build, codeql, validate, tokens, sonar, scorecard, release, release-dispatch, integrity, docs]
    types: [completed]
permissions:
  contents: read
jobs:
  notify:
    uses: lemonfiber/spec/.github/workflows/discord-notify.yml@c26ed83df4ecfeb0b1a2d4e565011605b67c648b # v1.0.38
    with:
      title: "${{ github.event.workflow_run.name }} · ${{ github.event.workflow_run.head_branch }}"
      body: "${{ github.event.repository.name }} — ${{ github.event.workflow_run.conclusion }} · ${{ github.event.workflow_run.head_sha }}"
      url: ${{ github.event.workflow_run.html_url }}
      color: ${{ github.event.workflow_run.conclusion == 'success' && '3066993' || '15158332' }}
    secrets:
      webhook: ${{ secrets.DISCORD_BUILD_WEBHOOK }}
