# The relay of pin-only (Q-R83, Q-R84). It runs on `pull_request`, as the pull
# request's own copy, with no token and no secrets, and does nothing: its run is
# the forge's record of each event and the head it was for. `pin-only-verdict.yml`
# runs from the default branch when it completes and posts `pin-only / pin-only`
# on the head. Every label runs it again, so `workflows-approved` is judged again.
name: pin-only
run-name: "#${{ github.event.pull_request.number }} ${{ github.event.action }} ${{ github.event.label.name }}"
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  pin-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: "true"
