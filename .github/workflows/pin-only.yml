# A pull request cannot change what this repository's checks run on its own
# say (Q-R83). `pull_request_target` runs this file as the base branch holds
# it, so a pull request cannot rewrite it; the reusable checks nothing of the
# pull request out and reads its trees through the API. A change under
# `.github/workflows/` or `.github/actions/` other than spec's pins moving
# forward fails it, unless a maintainer approved the change it makes with the
# `workflows-approved` label. Every `labeled` and `unlabeled` runs it again,
# whatever the label: a skipped run would be its newest on the head, and branch
# protection reads the check from that run alone.
#
# The verdict is a check on the head commit the event names, so every new head
# gets its own run. Under `pull_request_target` `github.ref` is the base branch
# every pull request shares, so the group is keyed on the pull request's number.
# Only a push, on its first attempt, cancels the run in progress, which is for
# the head it replaced; nothing else is cancelled (Q-R75, Q-R83).
name: pin-only
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' && github.run_attempt == 1 }}
jobs:
  pin-only:
    permissions:
      contents: read
      pull-requests: read
    uses: lemonfiber/spec/.github/workflows/pin-only.yml@f19777c73feb01457787e5c4dd92eee17bc1feda # v1.0.116
