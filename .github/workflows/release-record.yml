# Tell the spec a release was published, so it records what shipped.
#
# `release-finalize` in the spec repo has always been triggered by a
# `release-published` dispatch and said in its own header that the binary repo
# fires one on publish. Nothing did. Publishing 0.5.0 announced it to Discord and
# otherwise did nothing at all, leaving the manifest at `releasable` — which
# blocks the next version from being staged. So a release nobody
# remembered to record by hand did not merely leave the record stale, it stopped
# the train.
#
# Fires on publish rather than on the draft, because a draft is not a release: it
# is a thing a person is still deciding about.
#
# A pre-release is not one either, and there is nothing here for it to record:
# a pre-release does not move the manifest's status, and the record
# it does leave is written by the lane that cut it, before the tag.
#
# Told apart by its tag rather than by the forge's pre-release flag, which cargo-dist
# sets on every version below 1.0.0 and which therefore separates nothing here. A
# guard on the flag would have stopped recording every release — and a manifest
# left unrecorded blocks the next version from being staged, which is the
# failure this whole workflow exists to end.
#
# The skip is said out loud, because a skip nobody can see is the same shape as a
# run that did nothing and reported success.
name: release-record

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  said:
    if: ${{ contains(github.event.release.tag_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: A pre-release records nothing here
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "::notice title=Pre-release::${TAG} moves no manifest status; the lane that cut it wrote its record before the tag."

  version:
    if: ${{ !contains(github.event.release.tag_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: The manifest is named by version, not by tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${TAG} is not a version tag; nothing to record."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  record:
    needs: version
    permissions:
      contents: read
    uses: lemonfiber/spec/.github/workflows/tell.yml@98f21cb8a4db83cfc079c1a848d977818af80c70 # v1.0.115
    with:
      repos: spec
      event: release-published
      payload: ${{ format('{{"version":"{0}"}}', needs.version.outputs.version) }}
      environment: release
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
