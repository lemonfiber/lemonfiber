# Label PRs by the area of the codebase they touch, mapped in .github/labeler.yml
# against the canonical area labels (OPS-R12). Reusable workflow lives in the spec.
name: labeler
on:
  pull_request:
permissions:
  contents: read
jobs:
  label:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@93bf49c96ae5b12e49daea523b1d66ae294babb0 # main
