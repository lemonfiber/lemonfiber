# Label PRs by the area of the codebase they touch, mapped in .github/labeler.yml
# against the canonical area labels (OPS-R12). Reusable workflow lives in the spec.
name: labeler
on:
  pull_request:
permissions:
  contents: read
jobs:
  label:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@718ef921411ed5823745aeb2e4efb7d842cca06e # main
