# Label PRs by the area of the codebase they touch, mapped in .github/labeler.yml
# against the canonical area labels (OPS-R12). Reusable workflow lives in the spec.
name: labeler
on:
  pull_request:
permissions:
  contents: read
jobs:
  label:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@9d1b96f05269fcf3d8b7a0b4e05d9b83082164ff # v1.0.2
