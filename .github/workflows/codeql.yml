# CodeQL static analysis: the Rust crates and the Actions workflows. Rust
# catches memory/logic classes the linters don't; actions catches workflow
# injection and supply-chain flaws. Q-R53.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 2"
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        if: matrix.language == 'rust'
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          # One category per language, because two analyses of one commit that do not
          # name themselves apart land in the same place and the second replaces the
          # first. The check then reports a configuration it saw on main as missing
          # here, and says so about whichever language finished second.
          category: "/language:${{ matrix.language }}"

  # The analysis finding something is not the same as anything stopping it. The
  # check GitHub raises beside it compares the configurations a pull request
  # produced against every one seen on main, and the supply-chain scan uploads
  # three that only ever run on main — so it is neutral on every pull request,
  # whatever the analysis found, and gates nothing. This asks the question that
  # was meant instead: is there an open alert against what this branch proposes.
  alerts:
    needs: analyze
    # Runs whatever the analysis did, which it could not safely do until the gate
    # below learned to tell an unanalysed commit from a clean one.
    #
    # `needs` alone made this job vanish when any language failed, and a skipped
    # required check satisfies branch protection — so the one gate that refuses a
    # branch an alert stands against was, in exactly the case where the analysis
    # went wrong, not a gate at all. It was the safer of two bad options then:
    # running it would have read an empty alert list and passed on nothing.
    #
    # It is no longer either. `no_open_codeql_alert.py` now refuses a commit it
    # has no analysis of, by language and by name, so running it after a failed
    # analysis produces a red check that says what is missing rather than a
    # skipped one that says nothing. GitHub's code-scanning upload failed for
    # hours on 2026-09-13 and every one of those runs took this job with it.
    #
    # `!cancelled()` rather than `always()`: a cancelled run is somebody pressing
    # stop, and finishing the job they stopped serves nobody.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A gate nobody has watched fail is a gate nobody knows works, so it is put
      # in front of an alert before it is trusted about their absence.
      - name: The gate refuses a branch an alert stands against
        run: python3 scripts/no_open_codeql_alert.py --self-test
      - name: No open CodeQL alert reaches main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.number) || github.ref }}
          PR: ${{ github.event.pull_request.number }}
          ANALYSIS: ${{ needs.analyze.result }}
        run: |
          set -euo pipefail

          # The commit the alerts are about: the merge commit on a pull request,
          # the pushed commit otherwise. Asked of the API rather than taken from
          # the event, because `github.event.pull_request.merge_commit_sha` is
          # the value at the time the event fired and the merge commit is rebuilt
          # whenever the base moves.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            sha=$(gh api "repos/${REPO}/pulls/${PR}" --jq '.merge_commit_sha')
          else
            sha=${GITHUB_SHA}
          fi

          # Both lists, for the same ref. An empty alert list means either "this
          # commit was analysed and is clean" or "this commit was never
          # analysed", and the gate refuses to guess which — so it is handed the
          # analyses and the commit rather than inferring either.
          # `analyze` succeeding means the upload was accepted, not that the
          # analysis is queryable — those are minutes apart. So this waits for
          # every language's analysis of this commit rather than racing it, and
          # the same function that decides the wait decides the gate, so there is
          # no second opinion to drift.
          gate() {
            python3 scripts/no_open_codeql_alert.py \
              --analyses analyses.json \
              --sha "${sha}" \
              --workflow .github/workflows/codeql.yml "$@"
          }

          # Five minutes is worth waiting for an analysis that is on its way and
          # nothing at all for one that is not. An analysis job that already
          # failed is not indexing; ask once, say so, and be red in seconds.
          tries=30
          if [ "${ANALYSIS}" != "success" ]; then
            echo "::warning::The analysis did not succeed (${ANALYSIS}), so this asks once rather than waiting for an upload that is not coming."
            tries=1
          fi

          for attempt in $(seq 1 "${tries}"); do
            gh api --paginate --slurp \
              "repos/${REPO}/code-scanning/analyses?ref=${RESULT_REF}" > analyses.json
            if gate --complete-only; then break; fi
            echo "  (${attempt}/${tries})"
            sleep 10
          done

          gh api --paginate --slurp \
            "repos/${REPO}/code-scanning/alerts?state=open&tool_name=CodeQL&ref=${RESULT_REF}" \
            | gate
