# The maintainer queue flag. Triggers are declared here because a reusable
# cannot declare its caller's; the behaviour lives in the spec repo.
#
# The list below is also the wait list. The flag only goes up once every check
# `main` requires has passed, and the reusable reads this same list back out of
# this file to know what it must see finish first — so a workflow missing from it
# is a workflow the gate never waits for and never re-evaluates on. `main`
# requires nineteen checks and they come from five workflows:
#
#   gates   gates / gates
#   pin-only pin-only / pin-only
#   build             check, deny
#   codeql            analyze (rust), analyze (actions), alerts / alerts
#   sonar             sonar, gate / gate
#   release-workflow  release-workflow
#
# Add a workflow to branch protection and it belongs here in the same change.
name: awaiting-maintainer
on:
  workflow_run:
    workflows: [gates, pin-only, build, codeql, sonar, release-workflow]
    types: [completed]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  awaiting:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/awaiting-maintainer.yml@f60d147988899bcb7a3422d132d8985992bf77a4 # v1.0.156
    secrets:
      DISCORD_MAINTAINERS_WEBHOOK: ${{ secrets.DISCORD_MAINTAINERS_WEBHOOK }}
