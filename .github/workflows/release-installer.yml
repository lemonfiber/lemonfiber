# Hold the published installer to what is claimed of the binary it places.
#
# `lemonfiber` never replaces its own binary. What an operator is handed is the
# command for whichever tool owns their copy, and for a shell install that command
# runs `lemonfiber-installer.sh` — so that script *is* the replacement mechanism,
# and the promises about replacing a binary are promises about it.
#
# `dist` generates it at release time, which means it is not in the tree to read and
# can change when the generator moves. So it is checked where it exists: on the
# published release, against the artefact an operator would actually run.
#
# After publication rather than before, because that is the first moment the asset
# exists. A failure here does not unpublish anything — it says that a release went
# out whose installer no longer holds, which is the thing worth being told loudly
# rather than finding out from somebody's broken machine.
name: release-installer

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  holds:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The tag reaches a download URL below, so its shape is settled before
      # anything uses it rather than trusted because of who can publish a release.
      - name: Refuse a tag that is not a version
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::refusing to act on a tag that is not vN.N.N: $TAG"
              exit 1
              ;;
          esac
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Take the tag's own copy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Fetch the installer this release published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern 'lemonfiber-installer.sh' \
            --output installer.sh
          test -s installer.sh

      # `--self-test` as well as the check: a claim that cannot fail is not a gate,
      # and the installer it is read against is generated by something outside this
      # repository, so the claims have to be held to their own standard every time.
      - name: Hold it to what it promises
        run: python3 scripts/the_installer_places_what_it_verified.py --self-test installer.sh
