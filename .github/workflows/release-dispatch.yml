# One-click release for maintainers. Validates that the version is already on
# main and tags it — the same thing `just release-tag` does from a shell, but
# from a button. Tagging is the whole job: the tag starts release.yml, which
# builds the artifacts and leaves a draft, and release-changelog puts the
# changelog on that draft. The draft is NOT published: a human reviews it and
# clicks Publish, which is what fires the #releases announcement (releasing.md
# step 3). Restricted to maintainers; every input is validated before any write.
#
# Two jobs, because what decides and what writes are held apart. `gate` runs the
# spec's gate scripts, read at spec@main, with a read-only token that is never
# written to disk. `tag` runs nothing from any checkout: it creates the tag the
# gate approved, on the commit the gate read, through the API.
#
# This used to run git-cliff and draft the release itself. Two workflows drafting
# one release is one release too many — cargo-dist's `gh release create` would
# find the tag already taken — and the changelog now has a place of its own.
name: release-dispatch
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 — must already be set in Cargo.toml on main."
        required: true
# The write grant belongs to no job here: the tag is created with the release
# App's token, minted in the one step that uses it. A top-level grant would apply
# to every job added later, including ones that only need to read.
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.main.outputs.commit }}
    steps:
      - name: Gate to maintainers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          perm=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq '.permission')
          case "$perm" in
            admin|maintain) echo "${ACTOR} is a maintainer (${perm})." ;;
            *) echo "::error::${ACTOR} lacks maintainer permission (${perm}); release refused."; exit 1 ;;
          esac
      # A dispatch runs the workflow file on the branch it was dispatched from, and
      # tags the commit at that branch's tip. A release is cut from main.
      - name: Dispatched from main
        env:
          DISPATCHED_FROM: ${{ github.ref }}
        run: |
          [ "$DISPATCHED_FROM" = "refs/heads/main" ] \
            || { echo "::error::dispatched from ${DISPATCHED_FROM}; a release is dispatched from refs/heads/main."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      # The commit the gate reads is the commit the tag names, and it is on main.
      - name: The commit to tag is on main
        id: main
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main \
            || { echo "::error::${commit} is not on main; a release is cut from main."; exit 1; }
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
      - name: Validate version against main
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version must be X.Y.Z, got '${VERSION}'."; exit 1; }
          cargo_ver=$(grep -m1 -E '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          [ "$cargo_ver" = "$VERSION" ] \
            || { echo "::error::Cargo.toml is ${cargo_ver}, not ${VERSION} — merge the version bump first."; exit 1; }
          if git rev-parse --verify --quiet "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::tag v${VERSION} already exists."; exit 1
          fi
      # The spec at `main`, deliberately unpinned. A pinned copy would hold this
      # release to the goal set as it was, which is the failure mode of every
      # stand-in: right about a moment that has passed. Same path the contract
      # page gate already uses, so there is one answer to where the spec is.
      #
      # Its scripts run in this job, and this job holds nothing that can write:
      # the token is read-only and neither checkout keeps it.
      - name: Check out the canonical spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lemonfiber/spec
          ref: main
          path: .spec-canonical
          persist-credentials: false
      # Before the tag and after the checkout, so the verdict is about this tree
      # rather than about whatever was gated last. Anything it cannot do is a
      # refusal: a gate that quietly does not run reads as one that passed.
      - name: The gate this tag must pass
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/the_gate_a_tag_must_pass.py --version "$VERSION"

  tag:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The release App rather than the workflow's own token, because a tag the
      # workflow token creates starts no workflow, and release.yml is what this
      # tag exists to start. Scoped to this repository and to contents.
      - name: Mint a token that may create the tag
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: lemonfiber
          permission-contents: write
      # Annotated but unsigned: a runner has no key. `just release-tag` cuts a
      # signed one from a machine that does, and is the path to use where the tag
      # itself should be verifiable.
      - name: Tag the release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: |
          set -euo pipefail
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version must be X.Y.Z, got '${VERSION}'."; exit 1; }
          echo "$COMMIT" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "::error::the gate named no commit to tag."; exit 1; }
          object=$(gh api "repos/${REPO}/git/tags" \
            -f tag="v${VERSION}" \
            -f message="lemonfiber v${VERSION}" \
            -f object="$COMMIT" \
            -f type=commit \
            --jq .sha)
          gh api "repos/${REPO}/git/refs" \
            -f ref="refs/tags/v${VERSION}" \
            -f sha="$object" > /dev/null
      - name: Tagged — the pipeline takes it from here
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "::notice title=Tagged::v${VERSION} is tagged. release.yml builds it and leaves a draft, release-changelog puts the changelog on that draft, and a maintainer publishes it."
