# Post/update a sticky PR comment linking this PR's cited spec identifiers to
# their defining files. Reusable lives in the spec repo.
name: spec-references
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions: {}
concurrency:
  # A pull request pushed again cancels the run on its old head, which nobody
  # will read and which holds runners the org shares (Q-R75). Every other event
  # (a push to main, a tag, a merge queue) is grouped by its own run, so it is
  # never cancelled and never cancels.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  refs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-references.yml@194c439b37bfa5ba48cc5c2071a1dbebbd77329a # v1.0.20
