name: sonar
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  # Read the summary SonarCloud posts on the PR, and post our own verdict.
  pull-requests: write
jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@75a348306ce8f67c0b06fc62c32a8546140ba955 # cargo-llvm-cov
      - name: Coverage (100% on applicable code — Q-R61)
        run: cargo llvm-cov --workspace --ignore-filename-regex '(main\.rs)' --fail-under-lines 100 --lcov --output-path lcov.info
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # The free-plan quality gate cannot require zero issues (Q-R63), so the
      # standard is enforced here instead: read the summary SonarCloud posts on
      # the PR and fail on any new issue (Q-R64). The verdict is posted back as
      # its own sticky comment, so the result is visible on the PR rather than
      # buried in the run log. The Sonar comment body is fetched at runtime and
      # only pattern-matched, never interpolated into the shell.
      - name: Enforce zero new SonarCloud issues (Q-R64)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BOT: sonarqubecloud[bot]
          MARKER: "<!-- lemonfiber:issue-gate -->"
        run: |
          set -euo pipefail

          # Post the verdict as a comment, updating our own previous one in place
          # so a re-run does not stack duplicates. The message is written to a
          # file so its markdown reaches the API verbatim, without shell or YAML
          # indentation leaking into it.
          verdict() {
            printf '%s\n\n%s\n' "$MARKER" "$1" > verdict.md
            id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
              --jq "[.[] | select(.body | contains(\"${MARKER}\"))] | last | .id // empty" || true)
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@verdict.md >/dev/null
            else
              gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@verdict.md >/dev/null
            fi
          }

          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "No SONAR_TOKEN — the scan did not run (fork PR); nothing to gate on."
            exit 0
          fi

          # SonarCloud edits one comment in place after its analysis finishes, so
          # poll for it rather than assume it has arrived by the time the scan
          # step returns.
          body=""
          for attempt in $(seq 1 30); do
            body=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
              --jq "[.[] | select(.user.login == \"${BOT}\")] | last | .body // empty" || true)
            if [ -n "$body" ]; then break; fi
            echo "Waiting for the SonarCloud summary… (${attempt}/30)"
            sleep 10
          done

          if [ -z "$body" ]; then
            verdict "### ⚠️ Issue gate — inconclusive · SonarCloud posted no summary within the timeout, so the new-issue count could not be read."
            echo "::error::SonarCloud posted no summary within the timeout"
            exit 1
          fi

          count=$(printf '%s' "$body" | grep -oE '\[[0-9]+ New issues\]' \
            | grep -oE '[0-9]+' | head -1 || true)
          if [ -z "$count" ]; then
            verdict "### ⚠️ Issue gate — inconclusive · could not read the new-issue count from the SonarCloud summary."
            echo "::error::Could not read the new-issue count from the SonarCloud summary"
            exit 1
          fi
          if [ "$count" -ne 0 ]; then
            verdict "### ❌ Issue gate failed · SonarCloud reports **${count} new issue(s)**; this repository requires zero (\`Q-R64\`)."
            echo "::error::SonarCloud reports ${count} new issue(s); this repo requires zero"
            exit 1
          fi
          verdict "### ✅ Issue gate passed · SonarCloud reports **0 new issues**."
          echo "SonarCloud reports 0 new issues."
