name: sonar
on:
  push:
    branches: [main]
  pull_request:
  # `sonar` and `gate / gate` are required, so both have to report on the queue's
  # branch. The tests and the coverage gate run over the merged tree exactly as on a
  # pull request. The scan runs too, and SonarCloud records it against the queue's
  # short-lived branch, since there is no pull request to decorate.
  merge_group:
# Read-only for the workflow. The one job that writes — the gate, which posts its
# verdict on the pull request — asks for that itself.
permissions:
  contents: read
concurrency:
  # A pull request pushed again cancels the run on its old head, which nobody
  # will read and which holds runners the org shares (Q-R75). Every other event
  # (a push to main, a tag, a merge queue) is grouped by its own run, so it is
  # never cancelled and never cancels.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# The token never shares a runner with code the repository builds. `coverage`
# compiles and runs every dependency's build script and every test, and a step on
# the same runner can rewrite what a later step runs — the tool cache, a
# downloaded action, `PATH` through `$GITHUB_PATH` — so it holds no secret and
# hands on only its report. `sonar` checks the tree out, reads that report and
# runs the scanner, and runs nothing from the repository. Only `sonar` and the
# gate are given `SONAR_TOKEN`, which is why a Dependabot run may be given it too.
# The report is read as data and nothing else: it lands outside the workspace, is
# refused unless it is the one regular file expected, and reaches the scanner as
# an argument, so it can overwrite nothing the scanner reads and is never run.
jobs:
  # Whether this change reaches code, for the jobs below that judge nothing else.
  # Each of them skips where it does not, and runs wherever this job did not
  # succeed, so an answer that could not be reached runs everything.
  scope:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit, so the base is here to compare against, and no file
          # contents but the checkout's: the comparison reads trees.
          fetch-depth: 0
          filter: blob:none
      - id: diff
        env:
          # A pull request's base, a merge group's, or on a push the commit
          # before it. Any other event has none, and the answer is then that
          # everything runs.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: python3 scripts/the_code_a_change_touches.py "${BASE}"

  coverage:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # The outermost edge only, where a test cannot follow — the justfile's
      # `coverage` recipe says what each exclusion is and why. Read from the file the
      # recipe reads, so the gate and a local run measure the same thing.
      - name: What the gate does not measure
        run: echo "SKIPPED=$(cat .config/coverage-skipped)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      # Its own key: instrumented artifacts are not the ones `check` builds, and a
      # shared key would have each job evicting the other's work.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: llvm-cov
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@75a348306ce8f67c0b06fc62c32a8546140ba955 # cargo-llvm-cov
      - uses: taiki-e/install-action@75a348306ce8f67c0b06fc62c32a8546140ba955 # nextest
        with:
          tool: cargo-nextest
      # One instrumented run, read by two steps, so a failing test and a line nothing
      # reached are told apart rather than both reading as a red gate.
      #
      # `--no-fail-fast` because a run stopped at its first failure leaves a profile of
      # whatever had been reached, and the coverage step would report that partial
      # profile as missed lines across every crate.
      - name: Tests
        run: cargo llvm-cov nextest --workspace --no-fail-fast --profile ci --no-report
      - name: Coverage (100% on applicable code)
        if: success() || failure()
        run: cargo llvm-cov report --ignore-filename-regex "$SKIPPED" --fail-under-lines 100 --lcov --output-path lcov.info
      # A gate that says only "below the threshold" sends whoever tripped it looking
      # for a line the run already knew. `report` re-reads the profile just gathered.
      #
      # Two questions. `--show-missing-lines` reads the export's merged segments, while
      # `--fail-under-lines` counts each instantiation, so a line one instantiation
      # missed and another took is a miss the line list cannot show; the second
      # question reads the regions, which do not merge. `just uncovered` asks the same
      # two from a shell.
      - name: The reader names a miss the line list cannot
        if: failure()
        run: python3 scripts/counted_but_not_named.py --self-test
      - name: Which lines the gate missed
        if: failure()
        run: |
          echo "── lines the gate could not reach ──"
          cargo llvm-cov report --ignore-filename-regex "$SKIPPED" --show-missing-lines || true
          cargo llvm-cov report --ignore-filename-regex "$SKIPPED" --json --output-path report.json
          echo "── the lines behind the count, and which kind each is ──"
          python3 scripts/counted_but_not_named.py < report.json
      # The profile is gone with the runner, and rebuilding it costs the whole run; the
      # report is a few megabytes and answers what the two steps above did not ask.
      - name: Keep the report the gate read
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: report.json
          retention-days: 7
      # The report names each file by its absolute path, which is the same path in
      # the scan job's checkout: both run in this repository's workspace.
      - name: Hand the report to the scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov
          path: lcov.info
          retention-days: 1
          if-no-files-found: error

  sonar:
    needs: [scope, coverage]
    # Runs whatever coverage did, and fails at once when it failed: a skipped job
    # reports as passing, so the required `sonar` would read green over a coverage
    # gate that was not met. `!cancelled()` rather than `always()`, because a
    # cancelled run is somebody pressing stop. Skipped with coverage where the
    # change reaches no code, since there is then no report and no code to scan.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: The coverage gate held
        env:
          RESULT: ${{ needs.coverage.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::The coverage job finished with ${RESULT}, so there is no report to scan."
            exit 1
          fi
      # Whole history, so the scanner can tell which lines a pull request changed
      # and blame each one. No submodule: nothing the scan reads lives in one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Into the runner's temporary directory, never the workspace: the artifact
      # comes from the job that ran the repository's code.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lcov
          path: ${{ runner.temp }}/coverage
      # What was found is reduced to one line of plain characters before it is
      # printed, so a file name cannot read as a workflow command.
      - name: The report is the one file expected
        env:
          DIR: ${{ runner.temp }}/coverage
          EXPECTED: lcov.info
        run: |
          set -euo pipefail
          found=$(find "$DIR" -mindepth 1 -printf '%P:%y,' | tr -c 'A-Za-z0-9._:,/-' '?')
          if [ "$found" != "${EXPECTED}:f," ]; then
            echo "::error::The coverage artifact has to hold ${EXPECTED} as a regular file and nothing else. It held (name:type, f file, l link, d directory): ${found:-nothing}"
            exit 1
          fi
      # A pull request from a fork reads no secret store, and a Dependabot run reads
      # the Dependabot one, so a pull request can arrive without a token.
      - name: Whether a token reached this run
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # A pull request without a token skips the scan rather than failing on an empty
      # one. A push to main and a merge group scan whatever they were given, so a
      # missing token there fails here, where it is named, and main's analysis is
      # what every pull request is measured against.
      - name: SonarQube Cloud scan
        id: scan
        if: github.event_name != 'pull_request' || steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # The report's path is given here rather than in `sonar-project.properties`.
        with:
          args: -Dsonar.rust.lcov.reportPaths=${{ runner.temp }}/coverage/lcov.info
      # Runs when the scan failed, and says whether the host was answering: a scanner
      # that cannot reach SonarCloud fails with a trace that reads like a finding.
      # It changes nothing about the run; the scan still failed and the check is red.
      - name: Whether SonarCloud was answering
        if: always() && steps.scan.outcome == 'failure'
        run: |
          set -uo pipefail
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 \
            https://sonarcloud.io/api/system/status 2>/dev/null || echo "000")

          # 000 is curl reaching nothing at all, which is the same news as a 5xx.
          case "$code" in
          5?? | 000)
            said="The scan failed and SonarCloud answered ${code} to a plain status request, so the host was unavailable rather than this pull request being at fault. Coverage ran in its own job and had to reach 100% either way. Re-run this job once sonarcloud.io is answering — no analysis gated this run."
            ;;
          *)
            said="The scan failed and SonarCloud answered ${code} to a plain status request, so the host was reachable and the failure is in this run rather than an outage. Read the scanner output above. No analysis gated this run."
            ;;
          esac

          echo "::notice::${said}"
          printf '### Why the SonarCloud scan failed\n\n%s\n' "$said" >> "$GITHUB_STEP_SUMMARY"
      # A skipped step is missing from the log, which reads the same as one that ran
      # and found nothing, so the skip is said under its own name.
      - name: Why the scan was skipped
        if: github.event_name == 'pull_request' && steps.token.outputs.present != 'true'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          said="The SonarCloud scan was skipped: no SONAR_TOKEN reached this run of a pull request opened by ${AUTHOR}. A pull request from a fork reads no secret store, and a Dependabot run reads the Dependabot one. Coverage ran in its own job and still had to reach 100%. No analysis was produced, so none gated this run."
          echo "::notice::${said}"
          printf '### SonarCloud scan skipped\n\n%s\n' "$said" >> "$GITHUB_STEP_SUMMARY"

  # Open SonarCloud issues must be zero, and the free plan's own quality gate cannot
  # be configured to that standard. The shared reusable in spec holds the count
  # instead, so every repository gates identically: it reads the scan's summary,
  # fails on any new issue, and posts a sticky verdict on the pull request. A summary
  # that never arrived, or one it cannot read, warns rather than blocks.
  gate:
    needs: [scope, sonar]
    # Runs whatever the scan did: `needs` alone would drop this job when the scan
    # fails, and a required check that never reports blocks a pull request with no
    # line saying why. A failed scan still leaves `sonar` red, which is required in
    # its own right. `!cancelled()` rather than `always()`, because a cancelled run
    # is somebody pressing stop.
    #
    # On a merge group the shared gate re-reads the new-issue count of every pull
    # request in the batch and the open count against the project, and refuses what
    # it cannot read, since in a queue a pass is a merge.
    #
    # Never skipped where the change reaches no code: a skipped call reports as
    # `gate`, not the required `gate / gate`. It is told so instead, and answers
    # without waiting for a scan that did not run.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@999f97e9414290f029391d5d541087b8a6d23bdf # v1.0.29
    with:
      # What this repository carries, declared here so it can be read without a
      # SonarCloud login. A ceiling rather than an allowance: it may not rise past
      # what stands against `main`, and at zero the gate refuses the first issue.
      allowed-open: 0
      code: ${{ needs.scope.result != 'success' || needs.scope.outputs.code == 'true' }}
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
