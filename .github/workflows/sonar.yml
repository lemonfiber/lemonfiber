name: sonar
on:
  push:
    branches: [main]
  pull_request:
  # `sonar` and `gate / gate` are required, so both have to report on the queue's
  # branch. The tests and the coverage gate run over the merged tree exactly as on a
  # pull request. The scan runs too, and SonarCloud records it against the queue's
  # short-lived branch, since there is no pull request to decorate.
  merge_group:
# Read-only for the workflow. The one job that writes — the gate, which posts its
# verdict on the pull request — asks for that itself.
permissions:
  contents: read
jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      # The outermost edge only, where a test cannot follow — the justfile's
      # `coverage` recipe says what each exclusion is and why. Read from the file the
      # recipe reads, so the gate and a local run measure the same thing.
      - name: What the gate does not measure
        run: echo "SKIPPED=$(cat .config/coverage-skipped)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      # Its own key: instrumented artifacts are not the ones `check` builds, and a
      # shared key would have each job evicting the other's work.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: llvm-cov
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@75a348306ce8f67c0b06fc62c32a8546140ba955 # cargo-llvm-cov
      - uses: taiki-e/install-action@75a348306ce8f67c0b06fc62c32a8546140ba955 # nextest
        with:
          tool: cargo-nextest
      # One instrumented run, read by two steps, so a failing test and a line nothing
      # reached are told apart rather than both reading as a red gate.
      #
      # `--no-fail-fast` because a run stopped at its first failure leaves a profile of
      # whatever had been reached, and the coverage step would report that partial
      # profile as missed lines across every crate.
      - name: Tests
        run: cargo llvm-cov nextest --workspace --no-fail-fast --profile ci --no-report
      - name: Coverage (100% on applicable code)
        if: success() || failure()
        run: cargo llvm-cov report --ignore-filename-regex "$SKIPPED" --fail-under-lines 100 --lcov --output-path lcov.info
      # A gate that says only "below the threshold" sends whoever tripped it looking
      # for a line the run already knew. `report` re-reads the profile just gathered.
      #
      # Two questions. `--show-missing-lines` reads the export's merged segments, while
      # `--fail-under-lines` counts each instantiation, so a line one instantiation
      # missed and another took is a miss the line list cannot show; the second
      # question reads the regions, which do not merge. `just uncovered` asks the same
      # two from a shell.
      - name: The reader names a miss the line list cannot
        if: failure()
        run: python3 scripts/counted_but_not_named.py --self-test
      - name: Which lines the gate missed
        if: failure()
        run: |
          echo "── lines the gate could not reach ──"
          cargo llvm-cov report --ignore-filename-regex "$SKIPPED" --show-missing-lines || true
          cargo llvm-cov report --ignore-filename-regex "$SKIPPED" --json --output-path report.json
          echo "── the lines behind the count, and which kind each is ──"
          python3 scripts/counted_but_not_named.py < report.json
      # The profile is gone with the runner, and rebuilding it costs the whole run; the
      # report is a few megabytes and answers what the two steps above did not ask.
      - name: Keep the report the gate read
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: report.json
          retention-days: 7
      # A Dependabot run reads secrets from the Dependabot store, and `SONAR_TOKEN` is
      # only in the Actions store, so the scan is skipped there rather than failing on
      # an empty token. Coverage above needs no token and runs either way.
      #
      # Keyed on who opened the pull request, which is what selects the secret store,
      # and not on `github.triggering_actor`, which becomes whoever pressed re-run. The
      # event is named too: a push to main and a merge group carry no pull request, so
      # the scan runs on both, and main's analysis is what every pull request is
      # measured against.
      - name: SonarQube Cloud scan
        id: scan
        if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Runs when the scan failed, and says whether the host was answering: a scanner
      # that cannot reach SonarCloud fails with a trace that reads like a finding.
      # It changes nothing about the run; the scan still failed and the check is red.
      - name: Whether SonarCloud was answering
        if: always() && steps.scan.outcome == 'failure'
        run: |
          set -uo pipefail
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 \
            https://sonarcloud.io/api/system/status 2>/dev/null || echo "000")

          # 000 is curl reaching nothing at all, which is the same news as a 5xx.
          case "$code" in
          5?? | 000)
            said="The scan failed and SonarCloud answered ${code} to a plain status request, so the host was unavailable rather than this pull request being at fault. Coverage ran above and had to reach 100% either way. Re-run this job once sonarcloud.io is answering — no analysis gated this run."
            ;;
          *)
            said="The scan failed and SonarCloud answered ${code} to a plain status request, so the host was reachable and the failure is in this run rather than an outage. Read the scanner output above. No analysis gated this run."
            ;;
          esac

          echo "::notice::${said}"
          printf '### Why the SonarCloud scan failed\n\n%s\n' "$said" >> "$GITHUB_STEP_SUMMARY"
      # A skipped step is missing from the log, which reads the same as one that ran
      # and found nothing, so the skip is said under its own name.
      - name: Why the scan was skipped
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          said="The SonarCloud scan was skipped: ${AUTHOR} opened this pull request, and a Dependabot run reads secrets from the Dependabot store rather than the Actions store, so SONAR_TOKEN is empty here and the scanner could only fail on it. Coverage ran above and still had to reach 100%. No analysis was produced, so none gated this run."
          echo "::notice::${said}"
          printf '### SonarCloud scan skipped\n\n%s\n' "$said" >> "$GITHUB_STEP_SUMMARY"

  # Open SonarCloud issues must be zero, and the free plan's own quality gate cannot
  # be configured to that standard. The shared reusable in spec holds the count
  # instead, so every repository gates identically: it reads the scan's summary,
  # fails on any new issue, and posts a sticky verdict on the pull request. A summary
  # that never arrived, or one it cannot read, warns rather than blocks.
  gate:
    needs: sonar
    # Runs whatever the scan did: `needs` alone would drop this job when the scan
    # fails, and a required check that never reports blocks a pull request with no
    # line saying why. A failed scan still leaves `sonar` red, which is required in
    # its own right. `!cancelled()` rather than `always()`, because a cancelled run
    # is somebody pressing stop.
    #
    # On a merge group the shared gate re-reads the new-issue count of every pull
    # request in the batch and the open count against the project, and refuses what
    # it cannot read, since in a queue a pass is a merge.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@60d130a3d799e4826111f9eeffa932b733bc22c3 # v1.0.16
    with:
      # What this repository carries, declared here so it can be read without a
      # SonarCloud login. A ceiling rather than an allowance: it may not rise past
      # what stands against `main`, and at zero the gate refuses the first issue.
      allowed-open: 0
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
