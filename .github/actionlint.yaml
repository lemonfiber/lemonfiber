# actionlint configuration.
#
# The release workflow is generated by cargo-dist (`dist generate`), not written
# by hand — see .github/workflows/release.yml and [workspace.metadata.dist] in
# Cargo.toml. Its shell steps trip a few style/info shellcheck codes that cargo-dist
# knows are safe in context (values it controls, written to $GITHUB_OUTPUT):
#   SC2086 (quote to prevent word-splitting), SC2129 (group redirects),
#   SC2001 (parameter expansion vs sed).
# We cannot fix them without editing generated output that `dist generate` would
# overwrite, so they are ignored — but only on that one generated file, and only
# those three codes. Every hand-written workflow stays strictly linted.
paths:
  .github/workflows/release.yml:
    ignore:
      - 'shellcheck reported issue .*SC(2086|2129|2001)'
