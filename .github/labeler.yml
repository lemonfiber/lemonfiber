# Area labels applied by the reusable auto-labeler, by changed path.
# The labels are the canonical set in the spec; this only maps paths to them.
# The adapters are a part of core, so a change there is labelled both; the crates
# the core is built from and tested through are labelled core.
adapters:
  - changed-files:
      - any-glob-to-any-file: ['crates/lemonfiber-adapters/**']
core:
  - changed-files:
      - any-glob-to-any-file:
          - 'crates/lemonfiber-adapters/**'
          - 'crates/lemonfiber-api/**'
          - 'crates/lemonfiber-core/**'
          - 'crates/lemonfiber-error/**'
          - 'crates/lemonfiber-fixtures/**'
          - 'crates/lemonfiber-ports/**'
          - 'crates/lemonfiber-testing/**'
cli:
  - changed-files:
      - any-glob-to-any-file: ['crates/lemonfiber/**']
manifest:
  - changed-files:
      - any-glob-to-any-file: ['crates/lemonfiber-manifest/**', 'crates/lemonfiber-plugin/**']
stack:
  - changed-files:
      - any-glob-to-any-file: ['assets/media-stack/**']
documentation:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md', '.docs/**']
ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**', '.config/**', 'justfile', 'deny.toml']
dependencies:
  - changed-files:
      - any-glob-to-any-file: ['**/Cargo.toml', '**/package.json', '.github/dependabot.yml']
