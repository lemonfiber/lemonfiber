# The substitute each capability `F14-R14` names is proved by, end to end against its
# pinned upstream, standing in for the bundle's choice of that capability for one media
# type: installed, its first run, conformance, substitution, the capability's features
# and undo. The substitutes job reads this file, one job for each arm.
#
# One [[substitute]] table per arm:
#
#   arm            the name of the arm, which its job and its line in the report carry.
#   capability     the capability the arm proves.
#   plugin         the substitute's `[plugin].id`.
#   origin         the substitute's repository, as an https URL.
#   revision       the full 40-hex commit it is proved at, on the origin's default
#                  branch. The train moves it on its rolling pin pull request.
#   stands_in_for  the plugin the bundle fills the capability with, which it replaces.
#   media_type     the media type the arm exercises the capability for.
#   claimed        `false` where the substitute's upstream is claimed against an account
#                  outside the house and runs unclaimed, so its arm proves install and the
#                  reading that names it `Open` alone.
#
# One [[curator]] table per curator the bundle pins that is run live through its own
# media's household request: set up and started by this build, wired by its seed alone,
# asked for one title by a household member, proved to grab it where the indexer site the
# operator gave the stack serves the release and the core's queue read lists it, and
# undone.
#
#   arm            the name of the arm, which its job and its line in the report carry.
#   plugin         the curator's `[plugin].id`.
#   origin         the curator's repository, as an https URL.
#   revision       the full 40-hex commit the bundle pins it at, which is the tree this
#                  build carries and the only one it installs the curator from.
#   media_type     the media type its household asks for.

schema = 1

[[substitute]]
arm           = "indexer-search"
capability    = "indexer.search"
plugin        = "nzbhydra2"
origin        = "https://github.com/lemonfiber/plugin-nzbhydra2"
revision      = "8bcefe043e070ce27aaa77ea85f80997c149bb60"
stands_in_for = "prowlarr"
media_type    = "tv"
claimed       = true

