# The substitute each capability `F14-R14` names, and each further one `F14-R31` asks for
# that an arm proves, is proved by, end to end against its pinned upstream, standing in
# for the bundle's choice of that capability, for one media type where it files media:
# installed, its first run, conformance, substitution, the capability's features and
# undo. The substitutes job reads this file, one job for each arm.
#
# One [[substitute]] table per arm:
#
#   arm            the name of the arm, which its job and its line in the report carry.
#   capability     the capability the arm proves.
#   plugin         the substitute's `[plugin].id`.
#   origin         the substitute's repository, as an https URL.
#   revision       the full 40-hex commit it is proved at, on the origin's default
#                  branch. The train moves it on its rolling pin pull request.
#   stands_in_for  the plugin the bundle fills the capability with, which it replaces.
#   media_type     the media type the arm exercises the capability for, where the
#                  capability files media. A challenge solver files none and names none.
#   claimed        `false` where the substitute's upstream is claimed against an account
#                  outside the house and runs unclaimed, so its arm proves install and the
#                  reading that names it `Open` alone.
#
# A substitute the bundle offers is pinned at the revision the bundle offers it at. One
# standing in for a curator is run live as a curator arm is, put in the curator's place
# once the stack is first seeded. Medusa looks a series up under the operator's TheTVDB
# key, the job's secret SUBSTITUTES_THETVDB_KEY (and SUBSTITUTES_THETVDB_PIN for a key
# that needs one); its arm is skipped, saying so, where the key is not set.
#
# A challenge solver standing in is run live: the stack's indexer told the solver by its
# seed alone and testing it, and the solver's adapter asked for a page out on the internet,
# which it fetches, and for one inside the stack, which it refuses before the solver is
# handed it. Where the job's variable SUBSTITUTES_CHALLENGE_SITE names the challenged
# site (crates/lemonfiber/tests/substitutes/challenge), the indexer is also given that
# site under the solver's tag and must find the release it holds, which the site answers
# only to a request carrying the cookie it hands a browser that ran its challenge.
#
# A download client standing in is run live as a curator arm is, put in the place of the
# client the bundle fills the capability with once the stack is first seeded: the indexer
# site serves the release as an NZB or a torrent, the curator grabs it through the client,
# and the core then pauses and resumes every client, the one standing in read back stopped
# and then fetching, every other being a service of the part it replaced.
#
# One [[curator]] table per curator the bundle pins that is run live through its own
# media's household request: set up and started by this build, wired by its seed alone,
# asked for one title by a household member, proved to grab it where the indexer site the
# operator gave the stack serves the release and the core's trace of the title reaches a
# grab, and undone.
#
#   arm            the name of the arm, which its job and its line in the report carry.
#   plugin         the curator's `[plugin].id`.
#   origin         the curator's repository, as an https URL.
#   revision       the full 40-hex commit the bundle pins it at, which is the tree this
#                  build carries and the only one it installs the curator from.
#   media_type     the media type its household asks for.

